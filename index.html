  const setMusicPhase = (phase) => {
    if (phase === currentPhase) return;

  const openDB = () => new Promise((resolve, reject) => { if (db) return resolve(db); const request = indexedDB.open(DB_NAME, DB_VERSION); request.onerror = () => reject(request.error); request.onsuccess = () => { db = request.result; resolve(db); }; request.onupgradeneeded = (event) => { const db = event.target.result; if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME); }; });

  const resetToDefaultMusic = async (phase) => { if (!musicBuffers.hasOwnProperty(phase)) return; musicBuffers[phase] = null; await saveBufferToDB(`music_${phase}`, null); if (isMusicPlaying && currentPhase === phase) { stopBackgroundMusic(); await startBackgroundMusic(phase); } };
  const loadAllFromDB = async () => {
    const soundTypes = ['correct', 'wrong', 'timeout', 'tick', 'fanfare', 'joker', 'countdown', 'roundEnd'];

    for (const phase of musicPhases) { const arrayBuffer = await loadBufferFromDB(`music_${phase}`); if (arrayBuffer && arrayBuffer !== null) { try { const audioBuffer = await decodeToAudioBuffer(arrayBuffer); musicBuffers[phase] = audioBuffer; } catch(e) { console.warn(`Error decodificando music_${phase}`, e); } } else { musicBuffers[phase] = null; } }

/* ═══════════════════════════════════════════════════════════════════════════
 *  GESTIÓN DE INDEXEDDB
 * ═══════════════════════════════════════════════════════════════════════════ */
const GAME_DB_NAME = 'DiloGameDB';
const GAME_DB_VERSION = 3;
const GAME_STATE_STORE = 'gameState';
const QUESTIONS_STORE = 'questions';
const SETTINGS_STORE = 'settings';
const HISTORY_STORE = 'questionHistory';
let gameDB = null;

const openGameDB = () => new Promise((resolve, reject) => {
  if (gameDB) return resolve(gameDB);
  const request = indexedDB.open(GAME_DB_NAME, GAME_DB_VERSION);
  request.onerror = () => reject(request.error);
  request.onsuccess = () => { gameDB = request.result; resolve(gameDB); };
  request.onupgradeneeded = (event) => {
    const db = event.target.result;
    if (!db.objectStoreNames.contains(GAME_STATE_STORE)) db.createObjectStore(GAME_STATE_STORE);
    if (!db.objectStoreNames.contains(QUESTIONS_STORE)) db.createObjectStore(QUESTIONS_STORE, { keyPath: 'id' });
    if (!db.objectStoreNames.contains(SETTINGS_STORE)) db.createObjectStore(SETTINGS_STORE);
    if (!db.objectStoreNames.contains(HISTORY_STORE)) db.createObjectStore(HISTORY_STORE, { keyPath: 'id', autoIncrement: true });
  };
});

const saveGameStateToDB = async (state) => { const db = await openGameDB(); return new Promise((resolve, reject) => { const tx = db.transaction(GAME_STATE_STORE, 'readwrite'); const store = tx.objectStore(GAME_STATE_STORE); const request = store.put(state, 'current'); request.onsuccess = () => resolve(); request.onerror = () => reject(request.error); }); };
const loadGameStateFromDB = async () => { const db = await openGameDB(); return new Promise((resolve, reject) => { const tx = db.transaction(GAME_STATE_STORE, 'readonly'); const store = tx.objectStore(GAME_STATE_STORE); const request = store.get('current'); request.onsuccess = () => resolve(request.result); request.onerror = () => reject(request.error); }); };
const saveQuestionsToDB = async (questions) => { const db = await openGameDB(); const tx = db.transaction(QUESTIONS_STORE, 'readwrite'); const store = tx.objectStore(QUESTIONS_STORE); const clearRequest = store.clear(); return new Promise((resolve, reject) => { clearRequest.onsuccess = () => { let completed = 0; if (questions.length === 0) { resolve(); return; } questions.forEach(q => { const addReq = store.put(q); addReq.onsuccess = () => { completed++; if (completed === questions.length) resolve(); }; addReq.onerror = (e) => reject(e); }); }; clearRequest.onerror = (e) => reject(e); }); };
const loadQuestionsFromDB = async () => { const db = await openGameDB(); return new Promise((resolve, reject) => { const tx = db.transaction(QUESTIONS_STORE, 'readonly'); const store = tx.objectStore(QUESTIONS_STORE); const request = store.getAll(); request.onsuccess = () => { const questions = request.result.map(migrateQuestion); resolve(questions); }; request.onerror = () => reject(request.error); }); };
const saveSettingsToDB = async (stageConfig, waitConfig, matchConfig) => { const db = await openGameDB(); const tx = db.transaction(SETTINGS_STORE, 'readwrite'); const store = tx.objectStore(SETTINGS_STORE); await store.put(stageConfig, 'stageConfig'); await store.put(waitConfig, 'waitConfig'); await store.put(matchConfig, 'matchConfig'); return new Promise(resolve => { tx.oncomplete = resolve; }); };
const loadSettingsFromDB = async () => { const db = await openGameDB(); const tx = db.transaction(SETTINGS_STORE, 'readonly'); const store = tx.objectStore(SETTINGS_STORE); const stageConfig = await new Promise(resolve => { const req = store.get('stageConfig'); req.onsuccess = () => resolve(req.result || DEFAULT_STAGE_CONFIG); }); const waitConfig = await new Promise(resolve => { const req = store.get('waitConfig'); req.onsuccess = () => resolve(req.result || DEFAULT_WAIT_CONFIG); }); const matchConfig = await new Promise(resolve => { const req = store.get('matchConfig'); req.onsuccess = () => resolve(req.result || DEFAULT_MATCH_CONFIG); }); return { stageConfig, waitConfig, matchConfig }; };
const saveQuestionHistoryToDB = async (entry) => { const db = await openGameDB(); const tx = db.transaction(HISTORY_STORE, 'readwrite'); const store = tx.objectStore(HISTORY_STORE); return store.add(entry); };
const loadQuestionHistoryFromDB = async () => { const db = await openGameDB(); const tx = db.transaction(HISTORY_STORE, 'readonly'); const store = tx.objectStore(HISTORY_STORE); return new Promise((resolve, reject) => { const request = store.getAll(); request.onsuccess = () => resolve(request.result || []); request.onerror = () => reject(request.error); }); };
const clearQuestionHistoryFromDB = async () => { const db = await openGameDB(); const tx = db.transaction(HISTORY_STORE, 'readwrite'); const store = tx.objectStore(HISTORY_STORE); return store.clear(); };
const migrateFromLocalStorage = async () => {
  const savedGame = localStorage.getItem('dilo_como_es_save'); if (savedGame) { try { await saveGameStateToDB(JSON.parse(savedGame)); localStorage.removeItem('dilo_como_es_save'); } catch(e) {} }
  const savedQuestions = localStorage.getItem('dilo_como_es_questions'); if (savedQuestions) { try { await saveQuestionsToDB(JSON.parse(savedQuestions)); localStorage.removeItem('dilo_como_es_questions'); } catch(e) {} }
};

/* ═══════════════════════════════════════════════════════════════════════════
 *  COMPONENTES GENÉRICOS (memoizados)
 * ═══════════════════════════════════════════════════════════════════════════ */
const ScoreFloat = memo(({value, color, x, y, onDone}) => {
  useEffect(()=>{ const t=setTimeout(onDone,1150); return()=>clearTimeout(t); },[]);
  return ( <div className="float-score" style={{ left: x, top: y, color, textShadow: `0 0 15px ${color}` }}>{value>0?`+${value}`:value}</div> );
});

const Timer = memo(({seconds, running, onEnd, tkey, size="sm", extraTime=0, bonusKey=0, bonusAmount=0, muteSounds=false}) => {
  const initialTime = seconds + extraTime;
  const [rem, setRem] = useState(initialTime);
  const [showBonus, setShowBonus] = useState(false);
  const maxRemRef = useRef(initialTime);
  const ref = useRef();
  const prevRem = useRef(rem);
  const bonusApplied = useRef(false);
  const prevBonusKey = useRef(bonusKey);
  const endedRef = useRef(false);
  const runningRef = useRef(running);
  const onEndRef = useRef(onEnd);
  useEffect(() => { onEndRef.current = onEnd; }, [onEnd]);
  useEffect(() => { runningRef.current = running; }, [running]);

  useEffect(()=>{
    const t = seconds + extraTime;
    setRem(t);
    maxRemRef.current = t;
    bonusApplied.current = false;
    prevBonusKey.current = bonusKey;
    endedRef.current = false;
    clearInterval(ref.current);
  }, [tkey]);

  useEffect(()=>{
    if (prevBonusKey.current === bonusKey) return;
    prevBonusKey.current = bonusKey;
    if (bonusAmount <= 0) return;
    endedRef.current = false;
    clearInterval(ref.current);
    setRem(r => {
      const next = r + bonusAmount;
      maxRemRef.current = Math.max(maxRemRef.current, next);
      return next;
    });
    setShowBonus(true);
    setTimeout(() => setShowBonus(false), 1200);
    if (runningRef.current) {
      ref.current = setInterval(()=>{
        setRem(r=>{
          if (r <= 1) { clearInterval(ref.current); if (!endedRef.current) { endedRef.current = true; onEndRef.current(); } return 0; }
          if (r <= 4 && r !== prevRem.current && !muteSounds) AudioEngine.tick();
          prevRem.current = r;
          return r - 1;
        });
      }, 1000);
    }
  }, [bonusKey]);

  useEffect(()=>{
    if (!running) { clearInterval(ref.current); return; }
    endedRef.current = false;
    ref.current = setInterval(()=>{
      setRem(r=>{
        if (r <= 1) {
          clearInterval(ref.current);
          if (!endedRef.current) { endedRef.current = true; onEndRef.current(); }
          return 0;
        }
        if (r <= 4 && r !== prevRem.current && !muteSounds) AudioEngine.tick();
        prevRem.current = r;
        return r - 1;
      });
    }, 1000);
    return () => clearInterval(ref.current);
  }, [running, tkey, muteSounds]);

  const pct = Math.min(100, (rem / (maxRemRef.current || 1)) * 100);
  const isCritical = rem <= 3 && running;
  const col = pct > 50 ? C.primary : pct > 25 ? C.tertiary : C.error;
  const d = size==="lg" ? 180 : 90;
  const inn = size==="lg" ? 148 : 72;
  const fs = size==="lg" ? 58 : 28;
  return ( <div style={{textAlign:"center", position:"relative"}}>
    {showBonus && (
      <div style={{ position:"absolute", top: size==="lg" ? -30 : -22, left:"50%", transform:"translateX(-50%)", background:"#ffc06390", border:"2px solid #ffc063", borderRadius:20, padding: size==="lg" ? "4px 14px" : "2px 10px", fontSize: size==="lg" ? 18 : 12, fontWeight:900, color:"#fff", whiteSpace:"nowrap", zIndex:10, animation:"pop-in 0.3s ease forwards", pointerEvents:"none" }}>+{bonusAmount}s 👑</div>
    )}
    <div style={{ position:"relative", width:d, height:d, margin:"0 auto 6px", borderRadius:"50%", background: `conic-gradient(${col} ${pct*3.6}deg, rgba(255,255,255,0.05) 0deg)`, display:"flex", alignItems:"center", justifyContent:"center", boxShadow: isCritical ? `0 0 20px ${col}` : "0 0 10px rgba(0,0,0,0.3)" }}>
      <div style={{ width:inn, height:inn, borderRadius:"50%", background: C.surfaceContainerLow, backdropFilter: "blur(4px)", display:"flex", alignItems:"center", justifyContent:"center", fontFamily: "'JetBrains Mono', monospace", fontSize:fs, fontWeight:700, color: isCritical ? C.error : col, fontVariantNumeric:"tabular-nums", animation: isCritical ? "critical-pulse 0.6s infinite" : "none" }}>{rem}</div>
    </div>
    <div style={{fontSize:size==="lg"?13:10, color:C.outline, letterSpacing:2, fontFamily:"'JetBrains Mono', monospace"}}>SEG</div>
  </div> );
});

      {waitConfig?.imageUrl && <img src={waitConfig.imageUrl} alt="Espera" style={{ maxHeight: "100px", marginBottom: "16px", borderRadius: "16px" }} />}

        {[...active].sort((a,b)=>b.score-a.score).slice(0,6).map((t,i)=>{ const idx = teams.findIndex(x=>x.name===t.name); const col = TC[idx % TC.length]; return ( <div key={t.name} className="pop-in" style={{ background: `rgba(44,54,64,0.7)`, border: `1px solid ${col}50`, borderRadius: 16, padding: "8px 20px", minWidth: 130, backdropFilter: "blur(4px)" }}>
          <div style={{ fontSize: 10, color: col, letterSpacing: 2, marginBottom: 4, fontWeight: 700 }}>#{i+1}</div>
          <div style={{ fontSize: 14, fontWeight: 600 }}>{t.name}</div>
          <div style={{ fontSize: 24, fontWeight: 800, color: col, fontFamily: "'JetBrains Mono', monospace" }}>{t.score.toLocaleString()}</div>
        </div> ); })}
      </div>
      <button onClick={onClose} style={{ background: C.primary, color: C.onPrimary, fontFamily: "'Hanken Grotesk', sans-serif", fontWeight: 800, border: "none", borderRadius: 40, padding: "12px 48px", fontSize: 14, cursor: "pointer", boxShadow: "0 0 15px #97df5c", transition: "0.2s" }} aria-label="Continuar torneo">▶ CONTINUAR TORNEO</button>
    </div>
  </div> );
});

const RoundHistory = memo(({history}) => {
  const [open, setOpen] = useState(false);
  if (!history.length) return null;
  return ( <div style={{background: C.surfaceContainer, borderRadius: 16, padding: 12, backdropFilter: "blur(4px)", border: `1px solid ${C.outlineVariant}`}}>
    <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", cursor:"pointer", userSelect:"none" }} onClick={()=>setOpen(o=>!o)}>
      <div style={{ fontSize: 10, color: C.secondary, letterSpacing: 1, fontWeight: 600, fontFamily: "'JetBrains Mono', monospace" }}>HISTORIAL ({history.length})</div>

const TieBreaker = memo(({teams, teamIndexes, onClose, onAwardPoints, addLog, onStateChange, questions}) => {
  const [phase, setPhase] = useState("setup");
  const [selectedQuestion, setSelectedQuestion] = useState(null);
  const [running, setRunning] = useState(false);
  const [tkey, setTkey] = useState(0);
  const [winner, setWinner] = useState(null);
  const [showVerse, setShowVerse] = useState(false);
  const activeTeams = useMemo(() => teamIndexes.map(i=>teams[i]).filter(Boolean), [teams, teamIndexes]);

  const phaseRef = useRef(phase);
  const selectedQuestionRef = useRef(selectedQuestion);
  const showVerseRef = useRef(showVerse);
  const runningRef = useRef(running);
  const tkeyRef = useRef(tkey);
  const winnerRef = useRef(winner);
  useEffect(() => { phaseRef.current = phase; }, [phase]);
  useEffect(() => { selectedQuestionRef.current = selectedQuestion; }, [selectedQuestion]);
  useEffect(() => { showVerseRef.current = showVerse; }, [showVerse]);
  useEffect(() => { runningRef.current = running; }, [running]);
  useEffect(() => { tkeyRef.current = tkey; }, [tkey]);
  useEffect(() => { winnerRef.current = winner; }, [winner]);

  const recitationQuestions = useMemo(() => {
    if (!questions) return [];
    return questions.filter(q => migrateQuestion(q).stage === 3 || getQType(q).id === "recitation");
  }, [questions]);
  
  useEffect(() => { AudioEngine.setMusicPhase('tiebreaker'); }, []);
  
  useEffect(() => {
    if (onStateChange) {
      onStateChange({
        phase,
        word: selectedQuestion?.text || "",

        running,
        tkey,
        winner,
        teams: activeTeams,
        teamIndexes

  const begin = useCallback(() => {

  }, [addLog]);
  
  const award = useCallback((ti) => {

            <div style={{display:"flex", justifyContent:"center", gap:8, marginBottom:16}}>
              <button onClick={()=>setRunning(r=>!r)} style={{ background: running ? `${C.error}20` : `${C.primary}20`, border:`1px solid ${running ? C.error : C.primary}`, color: running ? C.error : C.primary, borderRadius:40, padding:"6px 16px", fontSize:11, fontWeight:700, cursor:"pointer" }}> {running ? "⏸ Pausar" : "▶ Reanudar"} </button>

const MatchBoard = memo(({activeTeams, teamIndexes, setTeams, addLog, onPaso, onScoreAnim, teamCardRefs, onUseComodin, responseMode, activeResponderTeamIdx, onBuzzer, buzzerLocked}) => {
  const getTeamLetter = (globalIdx) => String.fromCharCode(65 + globalIdx);
  const [animatingComodin, setAnimatingComodin] = useState({ teamIdx: null, comodinIdx: null });
  
  const handleComodin = (ti, ji) => {
    setAnimatingComodin({ teamIdx: ti, comodinIdx: ji });
    setTimeout(() => setAnimatingComodin({ teamIdx: null, comodinIdx: null }), 300);
    onUseComodin(ti, ji);
  };
  
  const handle = (ti, pts, ji) => {
    const ri = teamIndexes[ti];
    if (pts === "joker") { handleComodin(ti, ji); return; }
    if (pts === "paso") { setTeams(ts=>ts.map((t,i)=>i===ri?{...t,pasoUsed:true, streak:0}:t)); addLog(`${activeTeams[ti].name} usó PASO (racha reiniciada)`); onPaso(); return; }
    setTeams(ts=>ts.map((t,i)=>i===ri?{...t, score:t.score+pts, streak: pts>0 ? (t.streak||0)+1 : 0}:t));
    addLog(`${activeTeams[ti].name}: ${pts>0?"+":""}${pts} pts`);
    if (onScoreAnim) onScoreAnim(ti, pts);
    if (pts > 0) AudioEngine.correct(); else AudioEngine.wrong();
  };
  
  return ( <div className="match-board-scroll"> <div style={{ display: "inline-flex", gap: 12 }}> {activeTeams.map((t,i)=>{ const globalIdx = teamIndexes[i]; const col = TC[globalIdx % TC.length]; const teamLetter = getTeamLetter(globalIdx); const isTurn = (responseMode === "single" && activeResponderTeamIdx === i); const isAnim = animatingComodin.teamIdx === i; return ( <div key={i} ref={el=>{ if(teamCardRefs) teamCardRefs.current[i]=el; }} style={{ background: C.surfaceContainer, border: `1px solid ${col}60`, borderRadius: 20, padding: "14px 12px", textAlign:"center", backdropFilter: "blur(4px)", transition: "0.2s", minWidth: "220px", ...(isTurn ? { border: '3px solid #97df5c', boxShadow: '0 0 20px #97df5c' } : {}) }}> <div style={{ fontSize: 11, letterSpacing: 1, color: col, fontWeight: 700, fontFamily: "'JetBrains Mono', monospace" }}>EQ {teamLetter}</div> <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6, marginBottom: 4 }}><span style={{ fontSize: 20 }}>{t.avatar || "🏆"}</span><div style={{ fontSize: 14, fontWeight: 600 }}>{t.name}</div></div> <div style={{ fontSize: 32, fontWeight: 800, fontFamily: "'JetBrains Mono', monospace", color: col, fontVariantNumeric:"tabular-nums" }}>{t.score.toLocaleString()}</div> <div style={{ fontSize: 12, color: col, marginBottom: 8 }}>🔥 {t.streak || 0}</div> <div style={{ fontSize: 9, color: C.outline, marginBottom: 12 }}>pts</div> <div style={{ display:"flex", gap: 6, justifyContent:"center", flexWrap:"wrap", marginBottom: 12 }}> {[100,200,500,-50,-100,-200].map(p=>( <button key={p} onClick={()=>handle(i,p)} style={{ background: p>0 ? `${C.primary}20` : `${C.error}20`, border: `1px solid ${p>0 ? C.primary : C.error}`, color: p>0 ? C.primary : C.error, borderRadius: 40, padding:"3px 10px", fontSize:11, fontWeight:600, cursor:"pointer" }} aria-label={`${p>0?"Agregar":"Restar"} ${Math.abs(p)} puntos`}>{p>0?"+":""}{p}</button> ))} </div> <div style={{ fontSize: 9, color: C.outline, marginBottom: 6 }}>Comodines</div> <div style={{ display:"flex", gap: 6, justifyContent:"center", marginBottom: 8 }}> {["50/50","Cap","Cmb"].map((j,ji)=>( <button key={ji} onClick={()=>handle(i,"joker",ji)} disabled={t.jokers[ji]} style={{ background: t.jokers[ji] ? "rgba(255,255,255,0.1)" : `${C.accent2}20`, border: `1px solid ${t.jokers[ji] ? C.outlineVariant : C.secondary}`, color: t.jokers[ji] ? C.outline : C.secondary, borderRadius: 40, padding:"3px 10px", fontSize:10, cursor: t.jokers[ji] ? "default" : "pointer", textDecoration: t.jokers[ji] ? "line-through" : "none", transition: "all 0.1s", animation: isAnim && animatingComodin.comodinIdx === ji ? "pop-in 0.2s ease-out" : "none", boxShadow: isAnim && animatingComodin.comodinIdx === ji ? `0 0 12px ${C.secondary}` : "none" }} aria-label={`Comodín ${j}`}>{j}</button> ))} </div> <button onClick={()=>handle(i,"paso")} disabled={t.pasoUsed} style={{ width:"100%", background: t.pasoUsed ? "rgba(255,255,255,0.03)" : `${C.tertiary}20`, border: `1px solid ${t.pasoUsed ? C.outlineVariant : C.tertiary}`, color: t.pasoUsed ? C.outline : C.tertiary, borderRadius: 40, padding:"5px", fontSize:10, cursor: t.pasoUsed ? "default" : "pointer", textDecoration: t.pasoUsed ? "line-through" : "none" }} aria-label="Usar pase">PASO</button> {responseMode === "single" && ( <button onClick={() => onBuzzer(i)} disabled={buzzerLocked || activeResponderTeamIdx !== null} style={{ background: buzzerLocked || activeResponderTeamIdx !== null ? "rgba(255,255,255,0.03)" : `${C.error}20`, border: `1px solid ${buzzerLocked || activeResponderTeamIdx !== null ? C.outlineVariant : C.error}`, color: buzzerLocked || activeResponderTeamIdx !== null ? C.outline : C.error, borderRadius: 40, padding: "5px 6px", fontSize: 11, cursor: buzzerLocked || activeResponderTeamIdx !== null ? "default" : "pointer", marginTop: 6, width: "100%" }}>🔊 BUZZER</button> )} </div> ); })} </div> </div> );
});

  return ( <><div style={{ display:"flex", flexDirection:"column", gap:12 }}> <div style={{ background: C.surfaceContainer, borderRadius: 20, padding: "12px 16px", backdropFilter: "blur(4px)" }}> <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}> <div> <div style={{ fontSize:12, color:C.secondary, fontWeight:700, letterSpacing:1 }}>{roundName}</div> <div style={{ fontSize:11, color:C.outline, marginTop:2 }}>{active.length} activos</div> </div> <div style={{display:"flex", gap:6}}> {roundComplete && active.length>1 && <button onClick={handleEliminateClick} style={{ background: `${C.error}20`, color: C.error, border: `1px solid ${C.error}`, borderRadius:40, padding:"4px 12px", fontSize:10, fontWeight:700, cursor:"pointer" }} aria-label="Eliminar equipo con menor puntaje">✕ Eliminar menor</button>} {roundComplete && <button onClick={onShowWait} style={{ background: `${C.secondary}20`, color: C.secondary, border: `1px solid ${C.secondary}`, borderRadius:40, padding:"4px 12px", fontSize:10, fontWeight:700, cursor:"pointer" }} aria-label="Mostrar pantalla de espera">⏸ Espera</button>} </div> </div> <button onClick={onTieBreaker} style={{ width:"100%", background: `${C.tertiary}20`, color: C.tertiary, border: `1px solid ${C.tertiary}`, borderRadius:40, padding:"6px", fontSize:10, fontWeight:700, cursor:"pointer" }} aria-label="Iniciar desempate">⚡ Desempate – Palabra por Palabra</button> </div> <div style={{ background: C.surfaceContainer, borderRadius: 20, padding: 12, overflowX:"auto" }}> <div style={{ fontSize:10, color:C.outline, letterSpacing:1, marginBottom:8 }}>ENFRENTAMIENTOS</div> {roundMatches.length===0 && <div style={{ fontSize:11, color:C.outline, textAlign:"center", padding:12 }}>Sin enfrentamientos</div>} {roundMatches.map((match,i)=>{ const isCur=i===currentMatchIdx, isDone=i<currentMatchIdx; return( <div key={i} style={{ background: isCur ? `${C.primary}20` : isDone ? "rgba(255,255,255,0.02)" : "rgba(255,255,255,0.04)", border: `1px solid ${isCur ? C.primary : C.outlineVariant}`, borderRadius: 12, padding:"6px 10px", marginBottom:6, display:"flex", alignItems:"center", gap:8, whiteSpace:"nowrap" }}> <div style={{ width:20, height:20, borderRadius:"50%", background: isCur ? C.primary : C.outlineVariant, display:"flex", alignItems:"center", justifyContent:"center", fontSize:9, fontWeight:700, color: isCur ? C.onPrimary : C.onSurface }}>{i+1}</div> <div style={{ flex:1, fontSize:11, overflowX:"auto", whiteSpace:"normal" }}> {match.includes("__BYE__") ? <><span style={{color:C.secondary}}>{match[0]}</span><span style={{color:C.outline, marginLeft:5, fontSize:9}}>— PASE</span></> : match.join(" vs ")} </div> {isDone && <span style={{fontSize:9, color:C.primary}}>✓</span>} {isCur && !isDone && ( <button onClick={()=>onStartMatch(i)} style={{ background: match.includes("__BYE__") ? C.secondary : C.primary, color: match.includes("__BYE__") ? C.onSecondary : C.onPrimary, border:"none", borderRadius:40, padding:"2px 12px", fontSize:10, fontWeight:700, cursor:"pointer" }} aria-label="Iniciar enfrentamiento">{match.includes("__BYE__") ? "⏭ Pase" : "▶ Iniciar"}</button> )} </div> ); })} </div> <div style={{ background: C.surfaceContainer, borderRadius: 20, padding: 12 }}> <div style={{ fontSize:10, color:C.outline, letterSpacing:1, marginBottom:8 }}>POSICIONES</div> {[...teams].sort((a,b)=>(a.eliminated===b.eliminated ? b.score-a.score : a.eliminated ? 1 : -1)).map((t,i)=>{ const idx=teams.findIndex(x=>x.name===t.name); const col = TC[idx%TC.length]; return( <div key={t.name} style={{ display:"flex", alignItems:"center", gap:8, padding:"6px 6px", borderBottom: `1px solid ${C.outlineVariant}`, opacity: t.eliminated ? 0.5 : 1 }}> <div style={{ width:22, height:22, borderRadius:"50%", background: t.eliminated ? C.outlineVariant : `${col}30`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:10, fontWeight:700, color: t.eliminated ? C.outline : col }}>{i+1}</div> <div style={{ flex:1, fontSize:12 }}>{t.name}</div> <div style={{ fontSize:13, fontWeight:700, fontFamily:"'JetBrains Mono', monospace", color: col }}>{t.score.toLocaleString()}</div> </div> ); })} </div> <RoundHistory history={history}/> </div> {showConfirmModal && ( <div className="modal-overlay"><div className="modal-card"><h3 style={{ marginBottom: 16, color: C.error }}>⚠️ Confirmar eliminación</h3><p style={{ marginBottom: 24 }}>¿Eliminar a <strong>{lowestTeam?.name}</strong> con {lowestTeam?.score} pts?</p><div style={{ display: 'flex', gap: 12, justifyContent: 'center' }}><button onClick={confirmElimination} style={{ background: C.error, color: C.onError, border: 'none', borderRadius: 40, padding: '8px 24px', cursor: 'pointer' }}>Sí, eliminar</button><button onClick={() => setShowConfirmModal(false)} style={{ background: 'transparent', border: `1px solid ${C.outlineVariant}`, color: C.outline, borderRadius: 40, padding: '8px 24px', cursor: 'pointer' }}>Cancelar</button></div></div></div> )}</> );
});

const SoundManager = memo(() => {
  const [customStatus, setCustomStatus] = useState({});
  const refreshStatus = async () => { const status = AudioEngine.getCustomSoundStatus(); setCustomStatus({ correct: !!status.correct, wrong: !!status.wrong, timeout: !!status.timeout, tick: !!status.tick, fanfare: !!status.fanfare, joker: !!status.joker, countdown: !!status.countdown, roundEnd: !!status.roundEnd, music_start: !!status.start, music_initial: !!status.initial, music_semifinal: !!status.semifinal, music_final: !!status.final, music_tiebreaker: !!status.tiebreaker }); };
  useEffect(() => { refreshStatus(); }, []);
  const handleFileUpload = async (type, file) => { if (!file) return; if (type.startsWith('music_')) { const phase = type.replace('music_', ''); await AudioEngine.setCustomMusic(phase, file); } else { await AudioEngine.setCustomSound(type, file); } refreshStatus(); };
  const resetSound = async (type) => { if (type.startsWith('music_')) { const phase = type.replace('music_', ''); await AudioEngine.resetToDefaultMusic(phase); } else { await AudioEngine.resetToDefaultSound(type); } refreshStatus(); };
  const playTest = (type) => { AudioEngine.playTestSound(type); };
  const soundItems = [
    { id: 'correct', label: '✅ Acierto', icon: '✓' },{ id: 'wrong', label: '❌ Error', icon: '✗' },{ id: 'timeout', label: '⏰ Tiempo agotado', icon: '⏱️' },{ id: 'tick', label: '⏱️ Tick (cuenta regresiva)', icon: '🔊' },{ id: 'fanfare', label: '🎉 Fanfarria (desempate)', icon: '🎺' },{ id: 'joker', label: '🃏 Comodín', icon: '✨' },{ id: 'countdown', label: '🔔 Inicio de cuenta regresiva', icon: '⏲️' },{ id: 'roundEnd', label: '🔚 Fin de ronda', icon: '🏁' },{ id: 'music_start', label: '🎵 Música de inicio', icon: '🏁' },{ id: 'music_initial', label: '🎵 Música ronda inicial / cuartos', icon: '🔊' },{ id: 'music_semifinal', label: '🎵 Música semifinal', icon: '⚡' },{ id: 'music_final', label: '🎵 Música final', icon: '🏆' },{ id: 'music_tiebreaker', label: '🎵 Música desempate', icon: '⚔️' } ];
  return ( <div style={{ padding: '20px', maxWidth: '800px', margin: '0 auto' }}><h2 style={{ marginBottom: '20px', color: C.primary }}>🎵 Configuración de sonidos y música por fases</h2><p style={{ marginBottom: '20px', color: C.outline }}>Puedes cargar tus propios archivos de audio (MP3, WAV, OGG) para cada evento y cada fase musical. Los sonidos se guardan automáticamente.</p><div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>{soundItems.map(item => ( <div key={item.id} style={{ background: C.surfaceContainer, borderRadius: 16, padding: '16px', border: `1px solid ${C.outlineVariant}` }}><div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: '12px' }}><div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}><span style={{ fontSize: '24px' }}>{item.icon}</span><span style={{ fontWeight: 'bold' }}>{item.label}</span>{customStatus[item.id] && <span style={{ fontSize: '12px', background: C.primary, color: C.onPrimary, padding: '2px 8px', borderRadius: '20px' }}>📀 Personalizado</span>}</div><div style={{ display: 'flex', gap: '8px' }}><button onClick={() => playTest(item.id)} style={{ background: `${C.secondary}20`, border: `1px solid ${C.secondary}`, color: C.secondary, borderRadius: 40, padding: '6px 16px', cursor: 'pointer' }}>🔊 Probar</button><label style={{ background: `${C.primary}20`, border: `1px solid ${C.primary}`, color: C.primary, borderRadius: 40, padding: '6px 16px', cursor: 'pointer' }}>📁 Cargar<input type="file" accept="audio/*" style={{ display: 'none' }} onChange={(e) => handleFileUpload(item.id, e.target.files[0])} /></label><button onClick={() => resetSound(item.id)} style={{ background: `${C.error}20`, border: `1px solid ${C.error}`, color: C.error, borderRadius: 40, padding: '6px 16px', cursor: 'pointer' }}>🔄 Restaurar predefinido</button></div></div></div> ))}</div></div> );
});

const QManager = memo(({questions, setQuestions, onExport, resetToDefault}) => {
  const allQuestions = useMemo(() => questions.map(migrateQuestion), [questions]);
  const typeIds = Object.keys(QUESTION_TYPES);
  const blank = { id: Date.now(), type: "multiple_choice", stage: 1, text: "", options: ["","","",""], answer: "A", levels: [1] };
  const [form, setForm] = useState(blank);
  const [editId, setEditId] = useState(null);
  const [filterType, setFilterType] = useState("all");
  const [filterLevel, setFilterLevel] = useState(0);
  const currentTypeDef = QUESTION_TYPES[form.type] || QUESTION_TYPES.multiple_choice;

  const changeType = (typeId) => {
    const def = QUESTION_TYPES[typeId];
    const defaultStage = TYPE_TO_STAGE[typeId] || 1;
    setForm(f => ({
      ...f,
      type: typeId,
      stage: f.stage || defaultStage,
      options: def.hasOptions ? (f.options?.length === 2 || !f.options ? ["","","",""] : f.options) : null,
      answer: def.answerIsLetter ? "A" : "",
      ...(def.twoOptionsOnly ? { options: ["Verdadero","Falso"] } : {}),
    }));
  };
  const toggleLevel = (level) => {
    setForm(f => {
      let newLevels = [...(f.levels || [])];
      if (newLevels.includes(level)) newLevels = newLevels.filter(l => l !== level);
      else newLevels.push(level);
      if (newLevels.length === 0) newLevels = [1];
      return { ...f, levels: newLevels };
    });
  };
  const save = () => {
    if (!form.text.trim()) return;
    const q = migrateQuestion({
      ...form,
      id: editId || Date.now(),
      options: currentTypeDef.hasOptions ? form.options.filter(o => o.trim()) : null,
    });
    setQuestions(qs => editId ? qs.map(x => x.id === editId ? q : x) : [...qs, q]);
    setForm({ ...blank, id: Date.now(), levels: [1] });
    setEditId(null);
  };
  const edit = (q) => {
    const mq = migrateQuestion(q);
    setForm({ ...mq, options: mq.options || ["","","",""], levels: mq.levels || [1] });
    setEditId(mq.id);
  };
  const del = (id) => setQuestions(qs => qs.filter(q => q.id !== id));
  const convertToOpen = (q) => {
    const qType = getQType(q);
    if (!qType.hasOptions || !qType.answerIsLetter) {
      alert("Solo se pueden convertir preguntas con opciones (múltiple opción, verdadero/falso, imagen)");
      return;
    }
    const optionLetters = ["A","B","C","D"];
    const answerLetter = q.answer;
    const correctIndex = optionLetters.indexOf(answerLetter);
    if (correctIndex === -1 || !q.options || !q.options[correctIndex]) {
      alert("No se pudo identificar la opción correcta");
      return;
    }
    const correctText = q.options[correctIndex];
    const newOpenQuestion = migrateQuestion({
      id: Date.now() + Math.random(),
      type: "open",
      stage: q.stage,
      levels: q.levels || [1],
      text: q.text,
      answer: correctText,
      options: null
    });
    setQuestions(prev => [...prev, newOpenQuestion]);
    alert(`✅ Pregunta abierta creada: "${q.text.substring(0, 50)}..."`);
  };
  const imp = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = ev => { try { setQuestions(JSON.parse(ev.target.result).map(migrateQuestion)); } catch {} };
    r.readAsText(file); e.target.value = "";
  };
  const importFromExcel = (file) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const workbook = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
      const newQs = [];
      rows.forEach((row, idx) => {
        const typeId = row.tipo || STAGE_TO_TYPE[parseInt(row.etapa)] || "multiple_choice";
        const def = QUESTION_TYPES[typeId] || QUESTION_TYPES.multiple_choice;
        let opts = null;
        if (def.hasOptions && row.opciones) {
          opts = String(row.opciones).split('|').map(s => s.trim());
          if (opts.length < 2) opts = null;
        }
        if (def.hasOptions && !opts) { console.warn(`Fila ${idx+1}: tipo ${typeId} sin opciones, omitida`); return; }
        let levels = [1];
        if (row.niveles) levels = String(row.niveles).split(',').map(n => parseInt(n.trim())).filter(n => n===1 || n===2);
        else if (row.nivel) levels = [parseInt(row.nivel)];
        if (levels.length === 0) levels = [1];
        newQs.push(migrateQuestion({
          id: Date.now() + idx,
          type: typeId,
          stage: parseInt(row.etapa) || TYPE_TO_STAGE[typeId] || 1,
          levels: levels,
          text: row.texto || '',
          options: opts,
          answer: row.respuesta || '',
        }));
      });
      if (newQs.length && confirm(`Se importarán ${newQs.length} preguntas. ¿Reemplazar el banco actual?`)) {
        setQuestions(newQs);
        alert(`Importadas ${newQs.length} preguntas.`);
      }
    };
    reader.readAsArrayBuffer(file);
  };
  const exportToExcel = () => {
    const data = allQuestions.map(q => ({
      tipo: q.type,
      etapa: q.stage,
      niveles: (q.levels || [1]).join(','),
      texto: q.text,
      opciones: q.options ? q.options.join('|') : '',
      respuesta: q.answer
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Preguntas');
    XLSX.writeFile(wb, `preguntas_${new Date().toISOString().slice(0,10)}.xlsx`);
  };
  const visibleQs = useMemo(() => {
    let filtered = allQuestions;
    if (filterType !== "all") filtered = filtered.filter(q => q.type === filterType);
    if (filterLevel !== 0) filtered = filtered.filter(q => q.levels && q.levels.includes(filterLevel));
    return filtered;
  }, [allQuestions, filterType, filterLevel]);
  const optionLetters = ["A","B","C","D"];

  return (
    <div style={{ display:"grid", gridTemplateColumns:"360px 1fr", gap:16, height:"calc(100vh - 80px)", padding:"0 24px" }}>
      <div style={{ background: C.surfaceContainer, borderRadius:24, padding:16, overflowY:"auto", backdropFilter:"blur(4px)" }}>
        <div style={{ fontSize:12, color:C.secondary, fontWeight:700, letterSpacing:1, marginBottom:12 }}>
          {editId ? "✏️ EDITAR PREGUNTA" : "➕ NUEVA PREGUNTA"}
        </div>
        <div style={{ marginBottom:14 }}>
          <div style={{ fontSize:9, color:C.outline, letterSpacing:1, marginBottom:6 }}>TIPO DE PREGUNTA</div>
          <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
            {typeIds.map(typeId => {
              const def = QUESTION_TYPES[typeId];
              const sel = form.type === typeId;
              return (
                <button key={typeId} onClick={() => changeType(typeId)}
                  style={{ background: sel ? `${def.color}25` : "transparent", border:`1px solid ${sel ? def.color : C.outlineVariant}`, color: sel ? def.color : C.outline, borderRadius:12, padding:"8px 12px", fontSize:11, cursor:"pointer", textAlign:"left", display:"flex", alignItems:"center", gap:8, transition:"0.15s" }}>
                  <span style={{fontSize:16}}>{def.icon}</span>
                  <span>
                    <div style={{fontWeight:700}}>{def.label}</div>
                    <div style={{fontSize:9, opacity:0.7, marginTop:1}}>{def.description}</div>
                  </span>
                </button>
              );
            })}
          </div>
        </div>
        <div style={{ marginBottom:12 }}>
          <div style={{ fontSize:9, color:C.outline, letterSpacing:1, marginBottom:4 }}>NIVELES</div>
          <div style={{ display:"flex", gap:6 }}>
            <button onClick={() => toggleLevel(1)} style={{ flex:1, background: (form.levels || []).includes(1) ? `${C.primary}20` : "transparent", border: `1px solid ${(form.levels || []).includes(1) ? C.primary : C.outlineVariant}`, color: (form.levels || []).includes(1) ? C.primary : C.outline, borderRadius:40, padding:"5px", fontSize:10, cursor:"pointer" }}>Club Bíblico (Nv1)</button>
            <button onClick={() => toggleLevel(2)} style={{ flex:1, background: (form.levels || []).includes(2) ? `${C.primary}20` : "transparent", border: `1px solid ${(form.levels || []).includes(2) ? C.primary : C.outlineVariant}`, color: (form.levels || []).includes(2) ? C.primary : C.outline, borderRadius:40, padding:"5px", fontSize:10, cursor:"pointer" }}>Líderes (Nv2)</button>
          </div>
        </div>
        <div style={{ marginBottom:12 }}>
          <div style={{ fontSize:9, color:C.outline, letterSpacing:1, marginBottom:4 }}>ETAPA</div>
          <div style={{ display:"flex", gap:6 }}>
            {[1,2,3].map(stg => (
              <button key={stg} onClick={() => setForm(f => ({...f, stage:stg}))}
                style={{ flex:1, background: form.stage === stg ? `${C.primary}20` : "transparent", border:`1px solid ${form.stage === stg ? C.primary : C.outlineVariant}`, color: form.stage === stg ? C.primary : C.outline, borderRadius:40, padding:"5px", fontSize:10, cursor:"pointer" }}>
                Etapa {stg}
              </button>
            ))}
          </div>
        </div>
        <div style={{ marginBottom:12 }}>
          <div style={{ fontSize:9, color:C.outline, letterSpacing:1, marginBottom:4 }}>PREGUNTA</div>
          <textarea value={form.text} onChange={e => setForm(f => ({...f, text:e.target.value}))} rows={3}
            style={{ width:"100%", background:C.surfaceContainerHigh, border:`1px solid ${C.outlineVariant}`, borderRadius:12, color:C.onSurface, fontSize:11, padding:"8px 10px", resize:"vertical", fontFamily:"inherit" }}
            placeholder="Escribe la pregunta aquí…" aria-label="Texto de la pregunta"/>
        </div>
        {currentTypeDef.hasOptions && (
          <div style={{ marginBottom:12 }}>
            <div style={{ fontSize:9, color:C.outline, letterSpacing:1, marginBottom:6 }}>OPCIONES {currentTypeDef.twoOptionsOnly ? "(2)" : "(4)"}</div>
            {(currentTypeDef.twoOptionsOnly ? optionLetters.slice(0,2) : optionLetters).map((l, i) => (
              <div key={l} style={{ display:"flex", alignItems:"center", gap:6, marginBottom:6 }}>
                <span style={{ width:24, height:24, borderRadius:"50%", background:"rgba(255,255,255,0.1)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:10, fontWeight:700 }}>{l}</span>
                <input value={form.options?.[i] || ""} onChange={e => { const o=[...(form.options||["","","",""])]; o[i]=e.target.value; setForm(f=>({...f,options:o})); }}
                  style={{ flex:1, background:C.surfaceContainerHigh, border:`1px solid ${form.answer===l ? currentTypeDef.color : C.outlineVariant}`, borderRadius:8, color:C.onSurface, fontSize:10, padding:"5px 8px" }}
                  aria-label={`Opción ${l}`}/>
                <button onClick={() => setForm(f => ({...f, answer:l}))}
                  style={{ width:24, height:24, borderRadius:"50%", background:form.answer===l ? currentTypeDef.color : "transparent", border:`1px solid ${form.answer===l ? currentTypeDef.color : C.outlineVariant}`, color: form.answer===l ? "#000" : C.outline, fontSize:9, cursor:"pointer" }}
                  aria-label={`Marcar ${l} como correcta`}>✓</button>
              </div>
            ))}
          </div>
        )}
        {!currentTypeDef.answerIsLetter && (
          <div style={{ marginBottom:12 }}>
            <div style={{ fontSize:9, color:C.outline, letterSpacing:1, marginBottom:4 }}>RESPUESTA CORRECTA</div>
            <textarea value={form.answer} onChange={e => setForm(f => ({...f, answer:e.target.value}))} rows={3}
              style={{ width:"100%", background:C.surfaceContainerHigh, border:`1px solid ${C.outlineVariant}`, borderRadius:12, color:C.onSurface, fontSize:11, padding:"8px 10px", fontFamily:"inherit" }}
              placeholder="Escribe la respuesta correcta…" aria-label="Respuesta correcta"/>
          </div>
        )}
        <div style={{ display:"flex", gap:8, marginTop:8 }}>
          <button onClick={save}
            style={{ flex:1, background:currentTypeDef.color, color:"#000", border:"none", borderRadius:40, padding:"8px", fontSize:11, fontWeight:700, cursor:"pointer" }}>
            {editId ? "💾 Actualizar" : "＋ Agregar"}
          </button>
          {editId && (
            <button onClick={() => { setForm({...blank,id:Date.now(), levels:[1]}); setEditId(null); }}
              style={{ background:"transparent", color:C.outline, border:`1px solid ${C.outlineVariant}`, borderRadius:40, padding:"8px 14px", fontSize:11, cursor:"pointer" }}>✕</button>
          )}
        </div>
        <div style={{ marginTop:14, display:"grid", gridTemplateColumns:"1fr 1fr", gap:6 }}>
          <button onClick={onExport} style={{ background:`${C.secondary}20`, color:C.secondary, border:`1px solid ${C.secondary}`, borderRadius:40, padding:"6px", fontSize:10, fontWeight:600, cursor:"pointer" }}>⬇ JSON</button>
          <label style={{ background:`${C.tertiary}20`, color:C.tertiary, border:`1px solid ${C.tertiary}`, borderRadius:40, padding:"6px", fontSize:10, fontWeight:600, cursor:"pointer", textAlign:"center" }}>
            ⬆ JSON <input type="file" accept=".json" onChange={imp} style={{display:"none"}}/>
          </label>
          <label style={{ background:`${C.primary}20`, color:C.primary, border:`1px solid ${C.primary}`, borderRadius:40, padding:"6px", fontSize:10, fontWeight:600, cursor:"pointer", textAlign:"center" }}>
            📊 Excel <input type="file" accept=".xlsx,.xls" onChange={e => e.target.files[0] && importFromExcel(e.target.files[0])} style={{display:"none"}}/>
          </label>
          <button onClick={exportToExcel} style={{ background:`${C.secondary}20`, color:C.secondary, border:`1px solid ${C.secondary}`, borderRadius:40, padding:"6px", fontSize:10, fontWeight:600, cursor:"pointer" }}>📊 Exportar</button>
        </div>
        <div style={{ marginTop:8 }}>
          <button onClick={resetToDefault} style={{ width:"100%", background:`${C.warn}20`, color:C.warn, border:`1px solid ${C.warn}`, borderRadius:40, padding:"6px", fontSize:10, fontWeight:600, cursor:"pointer" }}>⟳ Restablecer predeterminadas</button>
        </div>
        <div style={{ fontSize:9, color:C.outline, textAlign:"center", marginTop:10 }}>{allQuestions.length} preguntas en total</div>
      </div>

      <div style={{ background: C.surfaceContainer, borderRadius:24, padding:16, overflowY:"auto" }}>
        <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:12, flexWrap:"wrap" }}>
          <div style={{ fontSize:12, color:C.secondary, fontWeight:700 }}>BANCO DE PREGUNTAS</div>

const VoiceControl = memo(({ onCommand, isActive, onToggle }) => {
  const recognitionRef = useRef(null);
  const listeningRef = useRef(false);
  const onCommandRef = useRef(onCommand);
  useEffect(() => { onCommandRef.current = onCommand; }, [onCommand]);
  useEffect(() => {
    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) { console.warn("Reconocimiento de voz no soportado"); return; }
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.lang = 'es-ES';
    recognition.onresult = (event) => {
      const transcript = event.results[event.results.length-1][0].transcript.toLowerCase().trim();
      console.log("🎤 Voz detectada:", transcript);
      const cmd = onCommandRef.current;
      if (transcript.includes("iniciar")) cmd("start");
      else if (transcript.includes("pausar") || transcript.includes("pausa")) cmd("pause");
      else if (transcript.includes("correcto")) cmd("correct");
      else if (transcript.includes("incorrecto") || transcript.includes("incorrecto")) cmd("incorrect");
      else if (transcript.includes("siguiente") || transcript.includes("terminar")) cmd("next");
      else if (transcript.includes("mostrar respuesta")) cmd("reveal");
      else if (transcript.includes("ocultar")) cmd("hide");
      else if (transcript.includes("mostrar pregunta")) cmd("show");
      else if (transcript.includes("tiempo")) cmd("timeout");
      else if (transcript.includes("revelar")) cmd("manual_reveal");
      else if (transcript.match(/buzzer\s+(uno|dos|tres|cuatro|1|2|3|4)/i)) {
        let num = transcript.match(/(uno|1)/i) ? 0 : transcript.match(/(dos|2)/i) ? 1 : transcript.match(/(tres|3)/i) ? 2 : transcript.match(/(cuatro|4)/i) ? 3 : -1;
        if (num !== -1) cmd(`buzzer${num}`);
      }
    };
    recognition.onerror = (e) => { if (e.error === 'not-allowed') { listeningRef.current = false; onToggle(false); } };
    recognition.onend = () => { if (listeningRef.current) { try { recognition.start(); } catch(e) {} } };
    recognitionRef.current = recognition;
    return () => { listeningRef.current = false; try { recognition.stop(); } catch(e) {} };
  }, []);
  useEffect(() => {
    if (!recognitionRef.current) return;
    if (isActive && !listeningRef.current) { listeningRef.current = true; try { recognitionRef.current.start(); } catch(e) {} }
    else if (!isActive && listeningRef.current) { listeningRef.current = false; try { recognitionRef.current.stop(); } catch(e) {} }
  }, [isActive]);
  return ( <button onClick={() => onToggle(!isActive)} style={{ background: isActive ? "#ff4d4d" : `${C.secondary}20`, border: `1px solid ${isActive ? "#ff4d4d" : C.secondary}`, color: isActive ? "white" : C.secondary, borderRadius: 40, padding: "8px 12px", fontSize: 12, fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", gap: 6 }} aria-label={isActive ? "Desactivar control por voz" : "Activar control por voz"}> <span className={isActive ? "voice-active" : ""} style={{ display: "inline-block", width: 12, height: 12, borderRadius: "50%", background: isActive ? "#ff4d4d" : C.secondary, marginRight: 4 }}></span> 🎤 {isActive ? "Escuchando..." : "Activar voz"} </button> );
});

const RemoteControl = () => {
  const channelRef = useRef(null);

  useEffect(() => { const channel = new BroadcastChannel('dilocontrol'); channelRef.current = channel; setConnected(true); return () => { channel.close(); }; }, []);
  const sendCommand = (cmd) => { if (channelRef.current) channelRef.current.postMessage({ command: cmd }); };
  useEffect(() => { const handleKey = (e) => { const key = e.key; if (key === '1') sendCommand('start'); else if (key === '2') sendCommand('pause'); else if (key === '3') sendCommand('correct'); else if (key === '4') sendCommand('incorrect'); else if (key === '5') sendCommand('next'); else if (key === '6') sendCommand('reveal'); else if (key === '7') sendCommand('hide'); else if (key === '8') sendCommand('show'); else if (key === '9') sendCommand('timeout'); else if (key === '0') sendCommand('manual_reveal'); }; window.addEventListener('keydown', handleKey); return () => window.removeEventListener('keydown', handleKey); }, []);

function exportResultsToExcel(teams, historyLog, roundsHistory) {
  const summary = teams.map(t => ({ Equipo: t.name, 'Puntaje final': t.score, Eliminado: t.eliminated ? 'Sí' : 'No', Racha: t.streak || 0, Avatar: t.avatar || "🏆" }));
  const wsSummary = XLSX.utils.json_to_sheet(summary);
  const details = historyLog.map(l => ({ Tiempo: l.time, Mensaje: l.msg }));
  const wsDetails = XLSX.utils.json_to_sheet(details);
  const ranking = [...teams].sort((a,b)=>b.score-a.score).map((t,i) => ({ Posición: i+1, Equipo: t.name, Puntaje: t.score, Estado: t.eliminated ? 'Eliminado' : 'Activo', Avatar: t.avatar }));
  const wsRanking = XLSX.utils.json_to_sheet(ranking);
  const roundsData = roundsHistory.map(r => ({ Ronda: r.roundName, Eliminado: r.eliminated || '', Enfrentamientos: r.matches.map(m => m.scores.map(s => `${s.name}: ${s.bye ? 'BYE' : s.score}`).join(' | ')).join(' ; ') }));
  const wsRounds = XLSX.utils.json_to_sheet(roundsData);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, wsSummary, 'Resumen');
  XLSX.utils.book_append_sheet(wb, wsDetails, 'Detalle');
  XLSX.utils.book_append_sheet(wb, wsRanking, 'Ranking');
  XLSX.utils.book_append_sheet(wb, wsRounds, 'Rondas');
  XLSX.writeFile(wb, `resultados_${new Date().toISOString().slice(0,10)}.xlsx`);
}

function exportResultsToPDF(teams, historyLog, roundsHistory, questionHistory) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
  doc.setFont('helvetica', 'normal');
  
  doc.setFontSize(22);
  doc.setTextColor(0, 100, 0);
  doc.text('Dilo Como Es – ACTIVATE 2026', 14, 20);
  doc.setFontSize(12);
  doc.setTextColor(100);
  doc.text(`Generado: ${new Date().toLocaleString()}`, 14, 30);
  
  doc.setFontSize(14);
  doc.setTextColor(0);
  doc.text('Posiciones finales', 14, 45);
  const ranking = [...teams].sort((a,b)=>b.score-a.score).map((t,i) => [i+1, t.name, t.score.toLocaleString(), t.eliminated ? 'Eliminado' : 'Activo', t.streak || 0]);
  doc.autoTable({
    startY: 50,
    head: [['#', 'Equipo', 'Puntaje', 'Estado', 'Racha']],
    body: ranking,
    theme: 'striped',
    headStyles: { fillColor: [50, 150, 50] },
    margin: { left: 14, right: 14 }
  });
  
  let statsY = doc.lastAutoTable.finalY + 10;
  doc.setFontSize(14);
  doc.text('Estadísticas por equipo', 14, statsY);
  const teamStats = teams.map(t => {
    const qs = questionHistory.filter(q => q.teamName === t.name);
    const correct = qs.filter(q => q.correct).length;
    const total = qs.length;
    const pct = total ? (correct/total*100).toFixed(1) : '0';
    const maxStreak = t.streak || 0;
    return [t.name, correct, total-correct, total, `${pct}%`, maxStreak];
  });
  doc.autoTable({
    startY: statsY + 6,
    head: [['Equipo', 'Correctas', 'Incorrectas', 'Total', '% Acierto', 'Mejor racha']],
    body: teamStats,
    theme: 'striped',
    headStyles: { fillColor: [100, 100, 200] },
    margin: { left: 14, right: 14 }
  });
  
  let roundsY = doc.lastAutoTable.finalY + 10;
  if (roundsY > 180) {
    doc.addPage();
    roundsY = 20;
  }
  doc.setFontSize(14);
  doc.text('Resumen de rondas', 14, roundsY);
  const roundsData = roundsHistory.map(r => [r.roundName, r.eliminated || 'Ninguno', r.matches.length]);
  doc.autoTable({
    startY: roundsY + 6,
    head: [['Ronda', 'Eliminado', 'Enfrentamientos']],
    body: roundsData,
    theme: 'striped',
    headStyles: { fillColor: [200, 100, 0] },
    margin: { left: 14, right: 14 }
  });
  
  doc.save(`resultados_${new Date().toISOString().slice(0,10)}.pdf`);
}

idth=400,height=600')} style={{ background: `${C.secondary}20`, border: `1px solid ${C.secondary}`, color: C.secondary, borderRadius: 40, padding: "8px 12px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>📱 Control remoto</button> <label style={{ display: "flex", alignItems: "center", gap: 6, background: practiceMode ? `${C.warn}30` : C.surfaceContainerHigh, padding: "4px 10px", borderRadius: 40, fontSize: 10, fontWeight: 700, color: C.warn, cursor: "pointer" }}><input type="checkbox" checked={practiceMode} onChange={e => setPracticeMode(e.target.checked)} /> 🎓 Ensayo sin puntos</label> <button onClick={() => handleLevelChange(1)} style={{ background: currentLevel === 1 ? `${C.primary}20` : C.surfaceContainerHigh, border: `1px solid ${currentLevel === 1 ? C.primary : C.outlineVariant}`, color: currentLevel === 1 ? C.primary : C.outline, borderRadius: 40, padding: "8px 12px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>📘 Nivel 1 (Club Bíblico)</button><button onClick={() => handleLevelChange(2)} style={{ background: currentLevel === 2 ? `${C.primary}20` : C.surfaceContainerHigh, border: `1px solid ${currentLevel === 2 ? C.primary : C.outlineVariant}`, color: currentLevel === 2 ? C.primary : C.outline, borderRadius: 40, padding: "8px 12px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>📗 Nivel 2 (Líderes)</button> </div> <div style={{ background: C.surfaceContainer, borderRadius: 20, padding: 12, flex:1, overflowY:"auto", minHeight: 100 }}> <div style={{ fontSize: 9, color: C.outline, letterSpacing:1, marginBottom:4 }}>REGISTRO</div> {log.map((l,i)=>( <div key={i} style={{ fontSize: 10, color: i===0 ? C.onSurface : C.outline, padding:"2px 0", borderBottom: `1px solid ${C.outlineVariant}` }}><span style={{ color: C.outline, marginRight: 6, fontSize:9 }}>{l.time}</span>{l.msg}</div> ))} </div> </div> <div style={{ overflowY:"auto" }}> {matchInProgress && (
  <div style={{ background: C.surfaceContainer, borderRadius: 20, padding: 12, marginBottom: 12 }}>
    <div style={{ fontSize: 10, color: C.secondary, letterSpacing: 1, marginBottom: 8 }}>📋 PREGUNTAS DEL ENFRENTAMIENTO</div>
    <div style={{ maxHeight: 200, overflowY: 'auto' }}>
      {matchQuestionsList.map((q, idx) => (
        <div key={idx} style={{ 
          background: idx === currentQIndex ? `${C.primary}20` : 'transparent', 
          borderLeft: `3px solid ${idx === currentQIndex ? C.primary : C.outlineVariant}`,
          padding: '6px 8px',
          marginBottom: 6,
          borderRadius: 8,
          fontSize: 11
        }}>
          <div style={{ display: 'flex', justifyContent: 'space-between' }}>
            <span style={{ fontWeight: idx === currentQIndex ? 700 : 400 }}>{idx+1}. E{q.stage}</span>
            <span style={{ fontSize: 9, color: C.outline }}>{idx === currentQIndex ? 'ACTUAL' : ''}</span>
          </div>
          <div style={{ fontSize: 10, marginTop: 2, wordBreak: 'break-word' }}>{q.text.substring(0, 70)}</div>
        </div>
      ))}
    </div>
  </div>
)} <TournamentMgr teams={teams} onStartMatch={startMatch} currentMatchIdx={matchIdx} roundMatches={roundMatches} onEliminateLowest={elimLowest} roundName={roundName} roundComplete={roundDone} history={history} onShowWait={()=>setShowWait(true)} onTieBreaker={()=>setShowTie(true)} onWinner={setWinner} /> {!matchActive && ( <button onClick={genMatches} style={{ width:"100%", background: `${C.secondary}20`, color: C.secondary, border: `1px solid ${C.secondary}`, borderRadius: 40, padding:"10px", fontSize:12, fontWeight:700, cursor:"pointer", marginTop:12 }}>⚡ Generar enfrentamientos</button> )} <div style={{ marginTop: 12, background: C.surfaceContainer, borderRadius: 20, padding: 12 }}> <div style={{ fontSize:9, color:C.outline, letterSpacing:1, marginBottom:8 }}>REFERENCIA</div> {[1,2,3].map(s=>{ const cfg = stageConfig[s]; return ( <div key={s} style={{ marginBottom: 8, padding:"6px 10px", borderRadius: 12, background: `${cfg.color}10`, borderLeft: `4px solid ${cfg.color}` }}> <div style={{ fontSize:9, color: cfg.color, fontWeight:600 }}>Etapa {s}</div> <div style={{ fontSize:9, color:C.outline }}>⏱{cfg.time}s · ✓+{cfg.correct} · ✗{cfg.incorrect}</div> </div> ); })} </div> <QuestionHistoryView history={questionHistory} teams={teams} /> </div> </div> </> ); }

/* ═══════════════════════════════════════════════════════════════════════════
 *  CONFIGURACIÓN DE EQUIPOS (TeamSetup)
 * ═══════════════════════════════════════════════════════════════════════════ */
const TeamSetup = memo(({teams, setTeams, onStart, onLoadGame, hasSave}) => {
  const [avatarOptions] = useState(["🏆", "⚡", "🔥", "💎", "🎯", "⭐", "🏀", "⚽", "🎨", "🤖", "🐉", "🦅", "🌵", "🍕", "🚀"]);
  const add = () => { setTeams(ts=>[...ts,makeTeam(`Equipo ${ts.length+1}`, 0, "🏆")]); };
  const rem = i => { if(teams.length<=2)return; setTeams(ts=>ts.filter((_,idx)=>idx!==i)); };
  const ren = (i,n) => setTeams(ts=>ts.map((t,idx)=>idx===i?{...t,name:n}:t));
  const changeAvatar = (i, av) => setTeams(ts=>ts.map((t,idx)=>idx===i?{...t,avatar:av}:t));
  return ( <div style={{ maxWidth: 800, margin: "48px auto", background: C.surfaceContainer, borderRadius: 32, padding: 32, backdropFilter: "blur(8px)", border: `1px solid ${C.outlineVariant}` }}> <div style={{ textAlign:"center", marginBottom: 32 }}> <div style={{ fontFamily: "'Hanken Grotesk', sans-serif", fontSize: 36, fontWeight: 800, color: C.primary, letterSpacing: -1 }}>DILO COMO ES</div> <div style={{ fontSize: 13, color: C.outline, marginTop: 6, display: 'flex', justifyContent: 'center', alignItems: 'center', gap: 8 }}><svg viewBox="0 0 3450 1313" style={{ height: '24px', width: 'auto' }}><use href="#logo-svg-defs" /></svg><span>– Configuración</span></div> </div> <div style={{ marginBottom: 24 }}> <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom: 16 }}> <div style={{ fontSize: 12, color: C.secondary, fontWeight: 700, letterSpacing:1 }}>EQUIPOS ({teams.length})</div> <div style={{ display:"flex", gap: 8 }}> <button onClick={add} style={{ background: `${C.primary}20`, color: C.primary, border: `1px solid ${C.primary}`, borderRadius: 40, padding:"6px 16px", fontSize:11, fontWeight:600, cursor:"pointer" }}>+ Agregar</button> {hasSave && <button onClick={onLoadGame} style={{ background: `${C.tertiary}20`, color: C.tertiary, border: `1px solid ${C.tertiary}`, borderRadius: 40, padding:"6px 16px", fontSize:11, fontWeight:600, cursor:"pointer" }}>📂 Cargar última</button>} </div> </div> <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(280px,1fr))", gap: 12 }}> {teams.map((t,i)=>( <div key={i} style={{ display:"flex", alignItems:"center", gap: 12, marginBottom: 10, background: C.surfaceContainerHigh, borderRadius: 16, padding: "8px 12px" }}> <div style={{ width: 48, height: 48, borderRadius: "50%", background: `${TC[i%TC.length]}30`, border: `2px solid ${TC[i%TC.length]}`, display:"flex", alignItems:"center", justifyContent:"center", fontSize: 28 }}>{t.avatar || "🏆"}</div> <div style={{ flex:1 }}><input value={t.name} onChange={e=>ren(i,e.target.value)} style={{ width: "100%", background: C.surfaceContainer, border: `1px solid ${C.outlineVariant}`, borderRadius: 12, color: C.onSurface, fontSize: 13, padding:"8px 12px", marginBottom: 4 }} aria-label={`Nombre del equipo ${String.fromCharCode(65+i)}`} /><select value={t.avatar || "🏆"} onChange={e=>changeAvatar(i, e.target.value)} style={{ width: "100%", background: C.surfaceContainer, border: `1px solid ${C.outlineVariant}`, borderRadius: 12, color: C.onSurface, fontSize: 11, padding:"4px 8px" }} aria-label={`Avatar del equipo ${String.fromCharCode(65+i)}`}>{avatarOptions.map(av=> <option key={av} value={av}>{av}</option>)}</select></div> <button onClick={()=>rem(i)} disabled={teams.length<=2} style={{ background: `${C.error}20`, color: C.error, border: `1px solid ${C.error}`, borderRadius: 40, width:32, height:32, fontSize:12, cursor: teams.length<=2 ? "default" : "pointer" }} aria-label="Eliminar equipo">✕</button> </div> ))} </div> </div> <button onClick={onStart} style={{ width:"100%", background: C.primary, color: C.onPrimary, border:"none", borderRadius: 48, padding:"14px", fontSize: 14, fontWeight: 800, cursor:"pointer", boxShadow: "0 0 15px #97df5c" }}>⚡ COMENZAR TORNEO</button> </div> );
});

/* ═══════════════════════════════════════════════════════════════════════════
 *  APLICACIÓN PRINCIPAL (App)
 * ═══════════════════════════════════════════════════════════════════════════ */
function App() {
  const [tab, setTab] = useState("setup");
  const [questions, setQuestions] = useState([]);
  const [teams, setTeams] = useState(null);
  const [started, setStarted] = useState(false);
  const [savedGameData, setSavedGameData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [stageConfig, setStageConfig] = useState(DEFAULT_STAGE_CONFIG);
  const [waitConfig, setWaitConfig] = useState(DEFAULT_WAIT_CONFIG);
  const [matchConfig, setMatchConfig] = useState(DEFAULT_MATCH_CONFIG);

  useEffect(() => {
    const loadData = async () => {
      await migrateFromLocalStorage();
      let loadedQuestions = await loadQuestionsFromDB();
      if (!loadedQuestions || loadedQuestions.length === 0) { loadedQuestions = DEMO_Q; await saveQuestionsToDB(loadedQuestions); }
      setQuestions(loadedQuestions);
      const gameState = await loadGameStateFromDB();
      if (gameState) { setSavedGameData(gameState); setTeams(gameState.teams); setStarted(true); setTab("game"); } 
      else { setTeams([makeTeam("Equipo Alfa",0,"🏆"), makeTeam("Equipo Beta",0,"⚡"), makeTeam("Equipo Gamma",0,"🔥"), makeTeam("Equipo Delta",0,"💎")]); }
      const { stageConfig: savedStage, waitConfig: savedWait, matchConfig: savedMatch } = await loadSettingsFromDB();
      setStageConfig(savedStage); setWaitConfig(savedWait); setMatchConfig(savedMatch);
      setLoading(false);
    };
    loadData();
  }, []);

  useEffect(() => {
    if (questions.length) {
      saveQuestionsToDB(questions);
    }
  }, [questions]);

  const resetQuestionsToDefault = async () => { setQuestions(DEMO_Q); await saveQuestionsToDB(DEMO_Q); };
  const startNewGame = () => { setStarted(true); setTab("game"); };
  const restoreGame = () => { setStarted(true); setTab("game"); };
  const resetGame = () => { setStarted(false); setTeams([makeTeam("Equipo Alfa",0,"🏆"), makeTeam("Equipo Beta",0,"⚡"), makeTeam("Equipo Gamma",0,"🔥"), makeTeam("Equipo Delta",0,"💎")]); setTab("setup"); };
  const exportQ = () => { const blob = new Blob([JSON.stringify(questions,null,2)],{type:"application/json"}); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `preguntas_activate_${new Date().toISOString().slice(0,10)}.json`; a.click(); };
  const saveSettings = async (newStage, newWait, newMatch) => { setStageConfig(newStage); setWaitConfig(newWait); setMatchConfig(newMatch); await saveSettingsToDB(newStage, newWait, newMatch); alert("Ajustes guardados."); };
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('projector') === '1') return <ProjectorView />;
  if (urlParams.get('remote') === '1') return <RemoteControl />;
  if (loading) return <div style={{ background: C.bg, height: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', color: C.onSurface, fontSize: 20 }}>Cargando datos...</div>;
  if (savedGameData && !started) {
    return ( <div style={{ background: C.bg, height: "100vh", display:"flex", alignItems:"center", justifyContent:"center" }}><div style={{ background: C.surfaceContainer, borderRadius: 32, padding: 40, maxWidth: 500, textAlign:"center", backdropFilter:"blur(8px)" }}><div style={{ fontFamily: "'Hanken Grotesk', sans-serif", fontSize: 28, fontWeight: 800, color: C.primary, marginBottom: 16 }}>DILO COMO ES</div><div style={{ fontSize: 14, color: C.outline, marginBottom: 24 }}>Partida guardada encontrada</div><div style={{ background: C.surfaceContainerHigh, borderRadius: 20, padding: 16, marginBottom: 24, textAlign:"left" }}><div style={{ fontSize: 12, color: C.secondary }}>Resumen:</div><div style={{ fontSize: 11 }}>Ronda: {savedGameData.roundName}</div><div style={{ fontSize: 11 }}>Equipos activos: {savedGameData.teams.filter(t=>!t.eliminated).length}</div></div><div style={{ display:"flex", gap: 12 }}><button onClick={restoreGame} style={{ flex:1, background: C.primary, color: C.onPrimary, border:"none", borderRadius: 40, padding:"12px", fontWeight:700, cursor:"pointer" }}>▶ Restaurar</button><button onClick={()=>{ localStorage.removeItem('dilo_como_es_save'); setSavedGameData(null); }} style={{ flex:1, background: "transparent", border: `1px solid ${C.outlineVariant}`, color: C.outline, borderRadius: 40, padding:"12px", fontWeight:600, cursor:"pointer" }}>🔄 Nueva</button></div></div></div> );
  }
  return ( <div style={{ background: C.bg, height: "100vh", display: "flex", flexDirection: "column" }}> <div style={{ background: C.surfaceContainerLowest, padding: "0 24px", display:"flex", alignItems:"center", borderBottom: `2px solid ${C.primary}`, flexShrink:0 }}> <div style={{ display:"flex", alignItems:"center", gap:12, padding:"8px 0", marginRight:24 }}><svg viewBox="0 0 3450 1313" style={{ height: '24px', width: 'auto' }}><use href="#logo-svg-defs" /></svg><div style={{ fontWeight:600, color: C.onSurface }}>Dilo Como Es!</div></div> {started ? ( <> {[["game","🎮 Juego"],["questions","📋 Preguntas"],["sound","🎵 Sonidos"],["settings","⚙️ Ajustes"]].map(([id,lbl])=>( <button key={id} onClick={()=>setTab(id)} style={{ background: tab===id ? `${C.primary}20` : "transparent", color: tab===id ? C.primary : C.outline, border: "none", borderBottom: tab===id ? `2px solid ${C.primary}` : "2px solid transparent", padding:"12px 20px", fontSize:12, cursor:"pointer", fontWeight: tab===id ? 600 : 400 }} aria-label={`Ir a ${lbl}`}>{lbl}</button> ))} <div style={{ marginLeft:"auto", display:"flex", gap: 12, alignItems:"center" }}><span style={{ fontSize:10, color:C.outline }}>{teams.filter(t=>!t.eliminated).length} activos</span><button onClick={resetGame} style={{ background: `${C.error}20`, color: C.error, border: `1px solid ${C.error}`, borderRadius: 40, padding:"4px 12px", fontSize:10, cursor:"pointer" }} aria-label="Reiniciar juego">Reiniciar</button></div> </> ) : ( [["setup","⚙️ Equipos"],["questions","📋 Preguntas"],["settings","⚙️ Ajustes"]].map(([id,lbl])=>( <button key={id} onClick={()=>setTab(id)} style={{ background: tab===id ? `${C.primary}20` : "transparent", color: tab===id ? C.primary : C.outline, border: "none", borderBottom: tab===id ? `2px solid ${C.primary}` : "2px solid transparent", padding:"12px 20px", fontSize:12, cursor:"pointer" }} aria-label={`Ir a ${lbl}`}>{lbl}</button> )) )} </div> <div style={{ flex:1, padding:"20px 24px", overflowY:"auto" }}> {tab==="setup" && <TeamSetup teams={teams} setTeams={setTeams} onStart={startNewGame} onLoadGame={restoreGame} hasSave={!!savedGameData}/>} {tab==="questions" && <QManager questions={questions} setQuestions={setQuestions} onExport={exportQ} resetToDefault={resetQuestionsToDefault}/>} {tab==="game" && started && <GameView questions={questions} teams={teams} setTeams={setTeams} initialState={savedGameData} gameStateKey={GAME_STATE_KEY} stageConfig={stageConfig} waitConfig={waitConfig} matchConfig={matchConfig} />} {tab==="sound" && <SoundManager />} {tab==="settings" && <SettingsPanel stageConfig={stageConfig} waitConfig={waitConfig} matchConfig={matchConfig} onSave={saveSettings} />} </div> </div> );
}

function Root() {
  const [audioReady, setAudioReady] = useState(false);
  
  useEffect(() => {
    AudioEngine.init().then(() => setAudioReady(true));
  }, []);

  // ✅ Todos los hooks se llaman siempre, en el mismo orden
  useEffect(() => {
    if (!audioReady) return;
    const isProjector = window.location.search.includes('projector=1');
    const isRemote = window.location.search.includes('remote=1');
    if (!isProjector && !isRemote) {
      // Iniciamos música, pero puede ser bloqueada por autoplay; el usuario puede usar el botón de música.
      AudioEngine.startMusic('start').catch(e => console.warn("Autoplay bloqueado. Usa el botón de música."));
    }
  }, [audioReady]);

  useEffect(() => {
    const handleVisibilityChange = () => {
      if (!document.hidden && AudioEngine.isMusicPlaying()) {
        AudioEngine.resumeContext?.();
      }
    };
    document.addEventListener('visibilitychange', handleVisibilityChange);
    return () => document.removeEventListener('visibilitychange', handleVisibilityChange);
  }, []);

  if (!audioReady) {
    return <div style={{ background: C.bg, height: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', color: C.onSurface, fontSize: 20 }}>Cargando sonidos...</div>;
  }

  return ( <><LogoSymbol /><App /></> );
}

const GAME_STATE_KEY = 'dilo_como_es_save';
ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
</body>
</html>
