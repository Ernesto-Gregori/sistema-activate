/* ═══════════════════════════════════════════════════════ AUDIO ENGINE con música por fases ══ */
const AudioEngine = (() => {
  let ctx = null;
  let currentSource = null;
  let currentGain = null;
  let isMusicPlaying = false;
  let currentPhase = 'start';
  
  // Buffers de música por fase
  let musicBuffers = {
    start: null,      // Pantalla de inicio / proyector inactivo
    initial: null,    // Ronda Inicial / Cuartos de Final
    semifinal: null,  // Semifinal
    final: null,      // Final
    tiebreaker: null  // Desempate
  };
  
  let customBuffers = {
    correct: null,
    wrong: null,
    timeout: null,
    tick: null,
    fanfare: null,
    joker: null,
    countdown: null
  };
  
  let db = null;
  let readyPromise = null;
  let isReady = false;

  const DB_NAME = 'DiloSoundDB';
  const DB_VERSION = 2; // Incrementado para nueva estructura
  const STORE_NAME = 'sounds';

  const getCtx = () => {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    return ctx;
  };

  const resumeContext = async () => {
    const ac = getCtx();
    if (ac.state === 'suspended') await ac.resume();
  };

  const playSound = (type, fnDefault) => {
    try {
      const ac = getCtx();
      const buffer = customBuffers[type];
      if (buffer) {
        resumeContext().then(() => {
          const source = ac.createBufferSource();
          source.buffer = buffer;
          const gain = ac.createGain();
          gain.gain.value = 0.5;
          source.connect(gain);
          gain.connect(ac.destination);
          source.start();
        });
      } else {
        if (fnDefault) fnDefault(ac);
      }
    } catch(e) { console.warn(e); }
  };

  const tone = (ac, freq, type, start, dur, vol=0.5, ramp=true) => {
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.connect(g);
    g.connect(ac.destination);
    o.type = type;
    o.frequency.setValueAtTime(freq, ac.currentTime + start);
    g.gain.setValueAtTime(ramp ? 0 : vol, ac.currentTime + start);
    if (ramp) g.gain.linearRampToValueAtTime(vol, ac.currentTime + start + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + start + dur);
    o.start(ac.currentTime + start);
    o.stop(ac.currentTime + start + dur);
  };

  // Síntesis por defecto para cada fase (versiones sintéticas con diferentes tensiones)
  const playDefaultMusicForPhase = (phase, ac) => {
    if (currentSource) {
      try { currentSource.stop(); } catch(e) {}
      currentSource = null;
    }
    if (currentGain) currentGain.disconnect();
    currentGain = ac.createGain();
    currentGain.gain.value = 0.2;
    currentGain.connect(ac.destination);
    
    let interval;
    let tempo = 2.0;
    let notes = [];
    
    switch(phase) {
      case 'start':
        notes = [[261.63, 329.63, 392.00], [349.23, 440.00, 523.25], [293.66, 369.99, 440.00], [261.63, 329.63, 392.00]];
        tempo = 2.5;
        break;
      case 'initial':
        notes = [[261.63, 329.63], [293.66, 369.99], [329.63, 392.00], [349.23, 440.00]];
        tempo = 1.8;
        break;
      case 'semifinal':
        notes = [[293.66, 369.99, 440.00], [329.63, 392.00, 493.88], [349.23, 440.00, 523.25], [392.00, 493.88, 587.33]];
        tempo = 1.4;
        break;
      case 'final':
        notes = [[349.23, 440.00, 523.25], [392.00, 493.88, 587.33], [440.00, 523.25, 659.25], [493.88, 587.33, 698.46]];
        tempo = 1.2;
        break;
      case 'tiebreaker':
        notes = [[523.25, 659.25], [493.88, 587.33], [440.00, 523.25], [392.00, 493.88]];
        tempo = 1.0;
        break;
      default: return;
    }
    
    let chordIndex = 0;
    const playChord = () => {
      if (!isMusicPlaying || currentPhase !== phase) return;
      const now = ac.currentTime;
      const chord = notes[chordIndex % notes.length];
      chord.forEach(freq => {
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.connect(gain);
        gain.connect(currentGain);
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.12, now + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, now + tempo - 0.1);
        osc.start(now);
        osc.stop(now + tempo);
      });
      chordIndex++;
    };
    
    playChord();
    interval = setInterval(() => {
      if (isMusicPlaying && currentPhase === phase) playChord();
      else if (!isMusicPlaying) clearInterval(interval);
    }, tempo * 1000);
    
    return interval;
  };
  
  let musicInterval = null;

  const startBackgroundMusic = async (phase = 'start') => {
    if (!phase) phase = 'start';
    if (isMusicPlaying && currentPhase === phase) return;
    
    // Detener música actual
    if (currentSource) {
      try { currentSource.stop(); } catch(e) {}
      currentSource = null;
    }
    if (musicInterval) {
      clearInterval(musicInterval);
      musicInterval = null;
    }
    if (currentGain) currentGain.disconnect();
    
    const ac = getCtx();
    await resumeContext();
    
    currentPhase = phase;
    const buffer = musicBuffers[phase];
    
    if (buffer) {
      // Reproducir buffer personalizado
      currentSource = ac.createBufferSource();
      currentSource.buffer = buffer;
      currentSource.loop = true;
      currentGain = ac.createGain();
      currentGain.gain.value = 0.3;
      currentSource.connect(currentGain);
      currentGain.connect(ac.destination);
      currentSource.start();
      isMusicPlaying = true;
    } else {
      // Usar música sintética por defecto
      musicInterval = playDefaultMusicForPhase(phase, ac);
      isMusicPlaying = true;
    }
  };

  const stopBackgroundMusic = () => {
    if (musicInterval) { clearInterval(musicInterval); musicInterval = null; }
    if (currentSource) {
      try { currentSource.stop(); } catch(e) {}
      currentSource = null;
    }
    if (currentGain) {
      currentGain.gain.linearRampToValueAtTime(0, (ctx?.currentTime || 0) + 0.5);
      setTimeout(() => { if (currentGain) currentGain.disconnect(); }, 500);
    }
    isMusicPlaying = false;
  };

  const toggleMusic = async () => {
    if (isMusicPlaying) {
      stopBackgroundMusic();
    } else {
      await startBackgroundMusic(currentPhase || 'start');
    }
    return isMusicPlaying;
  };
  
  const setMusicPhase = (phase) => {
    if (isMusicPlaying) {
      stopBackgroundMusic();
      startBackgroundMusic(phase);
    } else {
      currentPhase = phase;
    }
  };

  // IndexedDB
  const openDB = () => {
    return new Promise((resolve, reject) => {
      if (db) return resolve(db);
      const request = indexedDB.open(DB_NAME, DB_VERSION);
      request.onerror = () => reject(request.error);
      request.onsuccess = () => { db = request.result; resolve(db); };
      request.onupgradeneeded = (event) => {
        const db = event.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          db.createObjectStore(STORE_NAME);
        }
      };
    });
  };

  const saveBufferToDB = async (key, arrayBuffer) => {
    const database = await openDB();
    return new Promise((resolve, reject) => {
      const tx = database.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      const request = store.put(arrayBuffer, key);
      request.onsuccess = () => resolve();
      request.onerror = () => reject(request.error);
    });
  };

  const loadBufferFromDB = async (key) => {
    const database = await openDB();
    return new Promise((resolve, reject) => {
      const tx = database.transaction(STORE_NAME, 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const request = store.get(key);
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  };

  const decodeToAudioBuffer = async (arrayBuffer) => {
    if (!arrayBuffer) return null;
    const ac = getCtx();
    return await ac.decodeAudioData(arrayBuffer);
  };

  const setCustomSound = async (type, file) => {
    const arrayBuffer = await file.arrayBuffer();
    const copy = arrayBuffer.slice(0);
    const audioBuffer = await decodeToAudioBuffer(arrayBuffer);
    customBuffers[type] = audioBuffer;
    await saveBufferToDB(type, copy);
  };

  const resetToDefaultSound = async (type) => {
    customBuffers[type] = null;
    await saveBufferToDB(type, null);
  };

  const setCustomMusic = async (phase, file) => {
    if (!musicBuffers.hasOwnProperty(phase)) return;
    const arrayBuffer = await file.arrayBuffer();
    const copy = arrayBuffer.slice(0);
    const audioBuffer = await decodeToAudioBuffer(arrayBuffer);
    musicBuffers[phase] = audioBuffer;
    await saveBufferToDB(`music_${phase}`, copy);
    if (isMusicPlaying && currentPhase === phase) {
      stopBackgroundMusic();
      await startBackgroundMusic(phase);
    }
  };

  const resetToDefaultMusic = async (phase) => {
    if (!musicBuffers.hasOwnProperty(phase)) return;
    musicBuffers[phase] = null;
    await saveBufferToDB(`music_${phase}`, null);
    if (isMusicPlaying && currentPhase === phase) {
      stopBackgroundMusic();
      await startBackgroundMusic(phase);
    }
  };

  const loadAllFromDB = async () => {
    const soundTypes = ['correct', 'wrong', 'timeout', 'tick', 'fanfare', 'joker', 'countdown'];
    for (const type of soundTypes) {
      const arrayBuffer = await loadBufferFromDB(type);
      if (arrayBuffer && arrayBuffer !== null) {
        try {
          const audioBuffer = await decodeToAudioBuffer(arrayBuffer);
          customBuffers[type] = audioBuffer;
        } catch(e) { console.warn(`Error decodificando ${type}`, e); }
      } else {
        customBuffers[type] = null;
      }
    }
    
    const musicPhases = ['start', 'initial', 'semifinal', 'final', 'tiebreaker'];
    for (const phase of musicPhases) {
      const arrayBuffer = await loadBufferFromDB(`music_${phase}`);
      if (arrayBuffer && arrayBuffer !== null) {
        try {
          const audioBuffer = await decodeToAudioBuffer(arrayBuffer);
          musicBuffers[phase] = audioBuffer;
        } catch(e) { console.warn(`Error decodificando music_${phase}`, e); }
      } else {
        musicBuffers[phase] = null;
      }
    }
  };

  const init = async () => {
    if (readyPromise) return readyPromise;
    readyPromise = (async () => {
      await loadAllFromDB();
      isReady = true;
    })();
    return readyPromise;
  };

  // Inicialización automática
  init();

  // Sonidos por defecto (síntesis)
  const defaultCorrect = (ac) => { [523.25,659.25,783.99,1046.50].forEach((f,i)=>{const o=ac.createOscillator();const g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,ac.currentTime+i*0.12);g.gain.linearRampToValueAtTime(0.3,ac.currentTime+i*0.12+0.02);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+i*0.12+0.45);o.start(ac.currentTime+i*0.12);o.stop(ac.currentTime+i*0.12+0.45);}); };
  const defaultWrong = (ac) => { [440,349.23,261.63].forEach((f,i)=>{const o=ac.createOscillator();const g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='sawtooth';o.frequency.value=f;g.gain.setValueAtTime(0,ac.currentTime+i*0.2);g.gain.linearRampToValueAtTime(0.35,ac.currentTime+i*0.2+0.02);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+i*0.2+0.25);o.start(ac.currentTime+i*0.2);o.stop(ac.currentTime+i*0.2+0.25);}); };
  const defaultTimeout = (ac) => { [880,660,440,220].forEach((f,i)=>{const o=ac.createOscillator();const g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='square';o.frequency.value=f;g.gain.setValueAtTime(0,ac.currentTime+i*0.15);g.gain.linearRampToValueAtTime(0.2,ac.currentTime+i*0.15+0.01);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+i*0.15+0.2);o.start(ac.currentTime+i*0.15);o.stop(ac.currentTime+i*0.15+0.2);}); };
  const defaultTick = (ac) => { const o=ac.createOscillator();const g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='square';o.frequency.value=880;g.gain.setValueAtTime(0,ac.currentTime);g.gain.linearRampToValueAtTime(0.1,ac.currentTime+0.01);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.08);o.start(ac.currentTime);o.stop(ac.currentTime+0.08); };
  const defaultFanfare = (ac) => { [523,659,784,1047,1319].forEach((f,i)=>{const o=ac.createOscillator();const g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,ac.currentTime+i*0.1);g.gain.linearRampToValueAtTime(0.4,ac.currentTime+i*0.1+0.02);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+i*0.1+0.3);o.start(ac.currentTime+i*0.1);o.stop(ac.currentTime+i*0.1+0.3);}); };
  const defaultJoker = (ac) => { [800,1000,1200,1500].forEach((f,i)=>{const o=ac.createOscillator();const g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,ac.currentTime+i*0.08);g.gain.linearRampToValueAtTime(0.25,ac.currentTime+i*0.08+0.01);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+i*0.08+0.2);o.start(ac.currentTime+i*0.08);o.stop(ac.currentTime+i*0.08+0.2);}); };
  const defaultCountdown = (ac) => { const o=ac.createOscillator();const g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='sine';o.frequency.value=1200;g.gain.setValueAtTime(0,ac.currentTime);g.gain.linearRampToValueAtTime(0.3,ac.currentTime+0.01);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.1);o.start(ac.currentTime);o.stop(ac.currentTime+0.1); };

  return {
    correct() { playSound('correct', defaultCorrect); },
    wrong() { playSound('wrong', defaultWrong); },
    timeout() { playSound('timeout', defaultTimeout); },
    tick() { playSound('tick', defaultTick); },
    fanfare() { playSound('fanfare', defaultFanfare); },
    joker() { playSound('joker', defaultJoker); },
    countdown() { playSound('countdown', defaultCountdown); },
    startMusic: startBackgroundMusic,
    stopMusic: stopBackgroundMusic,
    toggleMusic,
    setMusicPhase,
    isMusicPlaying: () => isMusicPlaying,
    setCustomSound,
    resetToDefaultSound,
    setCustomMusic,
    resetToDefaultMusic,
    getCustomSoundStatus: () => ({ ...customBuffers, ...musicBuffers }),
    playTestSound: (type) => {
      if (type.startsWith('music_')) {
        const phase = type.replace('music_', '');
        if (isMusicPlaying) stopBackgroundMusic();
        startBackgroundMusic(phase);
        setTimeout(() => { if (isMusicPlaying) stopBackgroundMusic(); }, 5000);
      } else {
        if (type === 'correct') AudioEngine.correct();
        else if (type === 'wrong') AudioEngine.wrong();
        else if (type === 'timeout') AudioEngine.timeout();
        else if (type === 'tick') AudioEngine.tick();
        else if (type === 'fanfare') AudioEngine.fanfare();
        else if (type === 'joker') AudioEngine.joker();
        else if (type === 'countdown') AudioEngine.countdown();
      }
    },
    init,
    isReady: () => isReady
  };
})();

/* ═══════════════════════════════════════════════════════ TIMER ══ */
function Timer({seconds, running, onEnd, tkey, size="sm", extraTime=0}) {
  const [rem, setRem] = useState(seconds + extraTime);
  const ref = useRef();
  const prevRem = useRef(rem);
  useEffect(()=>{ setRem(seconds + extraTime); }, [seconds, tkey, extraTime]);
  useEffect(()=>{
    if (!running) { clearInterval(ref.current); return; }
    ref.current = setInterval(()=>{ setRem(r=>{ if (r <= 1) { clearInterval(ref.current); onEnd(); return 0; } if (r <= 4 && r !== prevRem.current) AudioEngine.tick(); prevRem.current = r; return r - 1; }); }, 1000);
    return () => clearInterval(ref.current);
  }, [running, tkey, onEnd]);
  const pct = (rem / (seconds + extraTime)) * 100;
  const isCritical = rem <= 3 && running;
  const col = pct > 50 ? C.primary : pct > 25 ? C.tertiary : C.error;
  const d = size==="lg" ? 180 : 90;
  const inn = size==="lg" ? 148 : 72;
  const fs = size==="lg" ? 58 : 28;
  return ( <div style={{textAlign:"center"}}>
    <div style={{ position:"relative", width:d, height:d, margin:"0 auto 6px", borderRadius:"50%", background: `conic-gradient(${col} ${pct*3.6}deg, rgba(255,255,255,0.05) 0deg)`, display:"flex", alignItems:"center", justifyContent:"center", boxShadow: isCritical ? `0 0 20px ${col}` : "0 0 10px rgba(0,0,0,0.3)" }}>
      <div style={{ width:inn, height:inn, borderRadius:"50%", background: C.surfaceContainerLow, backdropFilter: "blur(4px)", display:"flex", alignItems:"center", justifyContent:"center", fontFamily: "'JetBrains Mono', monospace", fontSize:fs, fontWeight:700, color: isCritical ? C.error : col, fontVariantNumeric:"tabular-nums", animation: isCritical ? "critical-pulse 0.6s infinite" : "none" }}>{rem}</div>
    </div>
    <div style={{fontSize:size==="lg"?13:10, color:C.outline, letterSpacing:2, fontFamily:"'JetBrains Mono', monospace"}}>SEG</div>
  </div> );
}

/* ═══════════════════════════════════════════════════════ PROJECTOR VIEW (con letras fijas y nombre equipo) ══ */

  const matchTeams = activeMatchTeams.length ? activeMatchTeams : allTeams.slice(0,2);
  const mIdxs = matchTeamIndices.length ? matchTeamIndices : matchTeams.map((_,i)=>i);
  const getTeamLetter = (globalIdx) => String.fromCharCode(65 + globalIdx);

/* ═══════════════════════════════════════════════════════ MATCH BOARD (con letras fijas) ══ */
function MatchBoard({activeTeams, teamIndexes, setTeams, addLog, onPaso, onScoreAnim, teamCardRefs, onUseComodin}) {
  const getTeamLetter = (globalIdx) => String.fromCharCode(65 + globalIdx);
  const handle = (ti, pts, ji) => {
    const ri = teamIndexes[ti];
    if (pts === "joker") { onUseComodin(ti, ji); return; }
    if (pts === "paso") { setTeams(ts=>ts.map((t,i)=>i===ri?{...t,pasoUsed:true}:t)); addLog(`${activeTeams[ti].name} usó PASO`); onPaso(); return; }
    setTeams(ts=>ts.map((t,i)=>i===ri?{...t,score:t.score+pts}:t));
    addLog(`${activeTeams[ti].name}: ${pts>0?"+":""}${pts} pts`);
    if (onScoreAnim) onScoreAnim(ti, pts);
    if (pts > 0) AudioEngine.correct(); else AudioEngine.wrong();
  };
  return ( <div className="match-board-grid" style={{display:"grid", gridTemplateColumns:`repeat(${activeTeams.length},1fr)`, gap:12}}> {activeTeams.map((t,i)=>{ const globalIdx = teamIndexes[i]; const col = TC[globalIdx % TC.length]; const teamLetter = getTeamLetter(globalIdx); return ( <div key={i} ref={el=>{ if(teamCardRefs) teamCardRefs.current[i]=el; }} style={{ background: C.surfaceContainer, border: `1px solid ${col}60`, borderRadius: 20, padding: "14px 12px", textAlign:"center", backdropFilter: "blur(4px)", transition: "0.2s" }}> <div style={{ fontSize: 11, letterSpacing: 1, color: col, fontWeight: 700, fontFamily: "'JetBrains Mono', monospace" }}>EQ {teamLetter}</div> <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 4 }}>{t.name}</div> <div style={{ fontSize: 32, fontWeight: 800, fontFamily: "'JetBrains Mono', monospace", color: col, fontVariantNumeric:"tabular-nums" }}>{t.score.toLocaleString()}</div> <div style={{ fontSize: 9, color: C.outline, marginBottom: 12 }}>pts</div> <div style={{ display:"flex", gap: 6, justifyContent:"center", flexWrap:"wrap", marginBottom: 12 }}> {[100,200,500,-50,-100,-200].map(p=>( <button key={p} onClick={()=>handle(i,p)} style={{ background: p>0 ? `${C.primary}20` : `${C.error}20`, border: `1px solid ${p>0 ? C.primary : C.error}`, color: p>0 ? C.primary : C.error, borderRadius: 40, padding:"3px 10px", fontSize:11, fontWeight:600, cursor:"pointer" }}>{p>0?"+":""}{p}</button> ))} </div> <div style={{ fontSize: 9, color: C.outline, marginBottom: 6 }}>Comodines</div> <div style={{ display:"flex", gap: 6, justifyContent:"center", marginBottom: 8 }}> {["50/50","Cap","Cmb"].map((j,ji)=>( <button key={ji} onClick={()=>handle(i,"joker",ji)} disabled={t.jokers[ji]} style={{ background: t.jokers[ji] ? "rgba(255,255,255,0.03)" : `${C.accent2}20`, border: `1px solid ${t.jokers[ji] ? C.outlineVariant : C.secondary}`, color: t.jokers[ji] ? C.outline : C.secondary, borderRadius: 40, padding:"3px 10px", fontSize:10, cursor: t.jokers[ji] ? "default" : "pointer", textDecoration: t.jokers[ji] ? "line-through" : "none" }}>{j}</button> ))} </div> <button onClick={()=>handle(i,"paso")} disabled={t.pasoUsed} style={{ width:"100%", background: t.pasoUsed ? "rgba(255,255,255,0.03)" : `${C.tertiary}20`, border: `1px solid ${t.pasoUsed ? C.outlineVariant : C.tertiary}`, color: t.pasoUsed ? C.outline : C.tertiary, borderRadius: 40, padding:"5px", fontSize:10, cursor: t.pasoUsed ? "default" : "pointer", textDecoration: t.pasoUsed ? "line-through" : "none" }}>PASO</button> </div> ); })} </div> );
}

/* ═══════════════════════════════════════════════════════ TournamentMgr (con cambio de música al avanzar ronda) ══ */
function TournamentMgr({teams, onStartMatch, currentMatchIdx, roundMatches, onEliminateLowest, roundName, roundComplete, history, onShowWait, onTieBreaker}) {
  const active = teams.filter(t=>!t.eliminated);
  
  // Detectar fase por nombre de ronda y cambiar música
  useEffect(() => {
    let phase = 'initial';
    if (roundName === 'Final') phase = 'final';
    else if (roundName === 'Semifinal') phase = 'semifinal';
    else if (roundName === 'Ronda Inicial' || roundName === 'Cuartos de Final') phase = 'initial';
    else phase = 'initial';
    AudioEngine.setMusicPhase(phase);
  }, [roundName]);
  
  return ( <div style={{ display:"flex", flexDirection:"column", gap:12 }}> <div style={{ background: C.surfaceContainer, borderRadius: 20, padding: "12px 16px", backdropFilter: "blur(4px)" }}> <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}> <div> <div style={{ fontSize:12, color:C.secondary, fontWeight:700, letterSpacing:1 }}>{roundName}</div> <div style={{ fontSize:11, color:C.outline, marginTop:2 }}>{active.length} activos</div> </div> <div style={{display:"flex", gap:6}}> {roundComplete && active.length>1 && <button onClick={onEliminateLowest} style={{ background: `${C.error}20`, color: C.error, border: `1px solid ${C.error}`, borderRadius:40, padding:"4px 12px", fontSize:10, fontWeight:700, cursor:"pointer" }}>✕ Eliminar menor</button>} {roundComplete && <button onClick={onShowWait} style={{ background: `${C.secondary}20`, color: C.secondary, border: `1px solid ${C.secondary}`, borderRadius:40, padding:"4px 12px", fontSize:10, fontWeight:700, cursor:"pointer" }}>⏸ Espera</button>} </div> </div> <button onClick={onTieBreaker} style={{ width:"100%", background: `${C.tertiary}20`, color: C.tertiary, border: `1px solid ${C.tertiary}`, borderRadius:40, padding:"6px", fontSize:10, fontWeight:700, cursor:"pointer" }}>⚡ Desempate – Palabra por Palabra</button> </div> <div style={{ background: C.surfaceContainer, borderRadius: 20, padding: 12 }}> <div style={{ fontSize:10, color:C.outline, letterSpacing:1, marginBottom:8 }}>ENFRENTAMIENTOS</div> {roundMatches.length===0 && <div style={{ fontSize:11, color:C.outline, textAlign:"center", padding:12 }}>Sin enfrentamientos</div>} {roundMatches.map((match,i)=>{ const isCur=i===currentMatchIdx, isDone=i<currentMatchIdx; return( <div key={i} style={{ background: isCur ? `${C.primary}20` : isDone ? "rgba(255,255,255,0.02)" : "rgba(255,255,255,0.04)", border: `1px solid ${isCur ? C.primary : C.outlineVariant}`, borderRadius: 12, padding:"6px 10px", marginBottom:6, display:"flex", alignItems:"center", gap:8 }}> <div style={{ width:20, height:20, borderRadius:"50%", background: isCur ? C.primary : C.outlineVariant, display:"flex", alignItems:"center", justifyContent:"center", fontSize:9, fontWeight:700, color: isCur ? C.onPrimary : C.onSurface }}>{i+1}</div> <div style={{ flex:1, fontSize:11 }}> {match.includes("__BYE__") ? <><span style={{color:C.secondary}}>{match[0]}</span><span style={{color:C.outline, marginLeft:5, fontSize:9}}>— PASE</span></> : match.join(" vs ")} </div> {isDone && <span style={{fontSize:9, color:C.primary}}>✓</span>} {isCur && !isDone && ( <button onClick={()=>onStartMatch(i)} style={{ background: match.includes("__BYE__") ? C.secondary : C.primary, color: match.includes("__BYE__") ? C.onSecondary : C.onPrimary, border:"none", borderRadius:40, padding:"2px 12px", fontSize:10, fontWeight:700, cursor:"pointer" }}>{match.includes("__BYE__") ? "⏭ Pase" : "▶ Iniciar"}</button> )} </div> ); })} </div> <div style={{ background: C.surfaceContainer, borderRadius: 20, padding: 12 }}> <div style={{ fontSize:10, color:C.outline, letterSpacing:1, marginBottom:8 }}>POSICIONES</div> {[...teams].sort((a,b)=>(a.eliminated===b.eliminated ? b.score-a.score : a.eliminated ? 1 : -1)).map((t,i)=>{ const idx=teams.findIndex(x=>x.name===t.name); const col = TC[idx%TC.length]; return( <div key={t.name} style={{ display:"flex", alignItems:"center", gap:8, padding:"6px 6px", borderBottom: `1px solid ${C.outlineVariant}`, opacity: t.eliminated ? 0.5 : 1 }}> <div style={{ width:22, height:22, borderRadius:"50%", background: t.eliminated ? C.outlineVariant : `${col}30`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:10, fontWeight:700, color: t.eliminated ? C.outline : col }}>{i+1}</div> <div style={{ flex:1, fontSize:12 }}>{t.name}</div> <div style={{ fontSize:13, fontWeight:700, fontFamily:"'JetBrains Mono', monospace", color: col }}>{t.score.toLocaleString()}</div> </div> ); })} </div> <RoundHistory history={history}/> </div> );
}

/* ═══════════════════════════════════════════════════════ SOUND MANAGER (actualizado con fases musicales) ══ */
function SoundManager() {
  const [customStatus, setCustomStatus] = useState({});
  const refreshStatus = async () => {
    const status = AudioEngine.getCustomSoundStatus();
    setCustomStatus({
      correct: !!status.correct,
      wrong: !!status.wrong,
      timeout: !!status.timeout,
      tick: !!status.tick,
      fanfare: !!status.fanfare,
      joker: !!status.joker,
      countdown: !!status.countdown,
      music_start: !!status.start,
      music_initial: !!status.initial,
      music_semifinal: !!status.semifinal,
      music_final: !!status.final,
      music_tiebreaker: !!status.tiebreaker
    });
  };
  useEffect(() => { refreshStatus(); }, []);

  const handleFileUpload = async (type, file) => {
    if (!file) return;
    if (type.startsWith('music_')) {
      const phase = type.replace('music_', '');
      await AudioEngine.setCustomMusic(phase, file);
    } else {
      await AudioEngine.setCustomSound(type, file);
    }
    refreshStatus();
  };

  const resetSound = async (type) => {
    if (type.startsWith('music_')) {
      const phase = type.replace('music_', '');
      await AudioEngine.resetToDefaultMusic(phase);
    } else {
      await AudioEngine.resetToDefaultSound(type);
    }
    refreshStatus();
  };

  const playTest = (type) => {
    AudioEngine.playTestSound(type);
  };

  const soundItems = [
    { id: 'correct', label: '✅ Acierto', icon: '✓' },
    { id: 'wrong', label: '❌ Error', icon: '✗' },
    { id: 'timeout', label: '⏰ Tiempo agotado', icon: '⏱️' },
    { id: 'tick', label: '⏱️ Tick (cuenta regresiva)', icon: '🔊' },
    { id: 'fanfare', label: '🎉 Fanfarria (desempate)', icon: '🎺' },
    { id: 'joker', label: '🃏 Comodín', icon: '✨' },
    { id: 'countdown', label: '🔔 Inicio de cuenta regresiva', icon: '⏲️' },
    { id: 'music_start', label: '🎵 Música de inicio', icon: '🏁' },
    { id: 'music_initial', label: '🎵 Música ronda inicial / cuartos', icon: '🔊' },
    { id: 'music_semifinal', label: '🎵 Música semifinal', icon: '⚡' },
    { id: 'music_final', label: '🎵 Música final', icon: '🏆' },
    { id: 'music_tiebreaker', label: '🎵 Música desempate', icon: '⚔️' }
  ];

  return (
    <div style={{ padding: '20px', maxWidth: '800px', margin: '0 auto' }}>
      <h2 style={{ marginBottom: '20px', color: C.primary }}>🎵 Configuración de sonidos y música por fases</h2>
      <p style={{ marginBottom: '20px', color: C.outline }}>Puedes cargar tus propios archivos de audio (MP3, WAV, OGG) para cada evento y cada fase musical. Los sonidos se guardan automáticamente.</p>
      <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
        {soundItems.map(item => (
          <div key={item.id} style={{ background: C.surfaceContainer, borderRadius: 16, padding: '16px', border: `1px solid ${C.outlineVariant}` }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: '12px' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                <span style={{ fontSize: '24px' }}>{item.icon}</span>
                <span style={{ fontWeight: 'bold' }}>{item.label}</span>
                {customStatus[item.id] && <span style={{ fontSize: '12px', background: C.primary, color: C.onPrimary, padding: '2px 8px', borderRadius: '20px' }}>📀 Personalizado</span>}
              </div>
              <div style={{ display: 'flex', gap: '8px' }}>
                <button onClick={() => playTest(item.id)} style={{ background: `${C.secondary}20`, border: `1px solid ${C.secondary}`, color: C.secondary, borderRadius: 40, padding: '6px 16px', cursor: 'pointer' }}>🔊 Probar</button>
                <label style={{ background: `${C.primary}20`, border: `1px solid ${C.primary}`, color: C.primary, borderRadius: 40, padding: '6px 16px', cursor: 'pointer' }}>
                  📁 Cargar
                  <input type="file" accept="audio/*" style={{ display: 'none' }} onChange={(e) => handleFileUpload(item.id, e.target.files[0])} />
                </label>
                <button onClick={() => resetSound(item.id)} style={{ background: `${C.error}20`, border: `1px solid ${C.error}`, color: C.error, borderRadius: 40, padding: '6px 16px', cursor: 'pointer' }}>🔄 Restaurar predefinido</button>
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════ GAME VIEW (con botón de música siempre visible) ══ */
function GameView({questions, teams: initialTeams, setTeams: setTeamsParent, initialState, gameStateKey}) {
  const [teams, setTeamsState] = useState(() => initialState?.teams || initialTeams);
  const [usedIds, setUsedIds] = useState(() => initialState?.usedIds || []);
  const [roundMatches, setRoundMatches] = useState(() => initialState?.roundMatches || []);
  const [matchIdx, setMatchIdx] = useState(() => initialState?.matchIdx || 0);
  const [roundName, setRoundName] = useState(() => initialState?.roundName || "Ronda Inicial");
  const [roundDone, setRoundDone] = useState(() => initialState?.roundDone || false);
  const [history, setHistory] = useState(() => initialState?.history || []);
  const [curRoundData, setCurRoundData] = useState(() => initialState?.curRoundData || []);
  const [log, setLog] = useState(() => initialState?.log || []);
  const [fStage, setFStage] = useState(() => initialState?.fStage || 0);
  const [fLevel, setFLevel] = useState(() => initialState?.fLevel || 0);
  const [curQ, setCurQ] = useState(() => initialState?.curQ || null);
  const [showAns, setShowAns] = useState(() => initialState?.showAns || false);
  const [resolved, setResolved] = useState(() => initialState?.resolved || false);
  const [running, setRunning] = useState(() => initialState?.running || false);
  const [tkey, setTkey] = useState(() => initialState?.tkey || 0);
  const [extraTime, setExtraTime] = useState(() => initialState?.extraTime || 0);
  const [sel, setSel] = useState(() => initialState?.sel || {});
  const [hiddenOptions, setHiddenOptions] = useState(() => initialState?.hiddenOptions || null);
  const [responseMode, setResponseMode] = useState(() => initialState?.responseMode || "all");
  const [activeResponderTeamIdx, setActiveResponderTeamIdx] = useState(() => initialState?.activeResponderTeamIdx || null);
  const [matchActive, setMatchActive] = useState(() => initialState?.matchActive || false);
  const [showWait, setShowWait] = useState(false);
  const [showTie, setShowTie] = useState(false);
  const [scoreAnims, setScoreAnims] = useState([]);
  const [projectorWindow, setProjectorWindow] = useState(null);
  const [projectorActive, setProjectorActive] = useState(false);
  const [musicOn, setMusicOn] = useState(false);
  const teamCardRefs = useRef({});

  const active = teams.filter(t=>!t.eliminated);
  const curMatch = roundMatches[matchIdx] || [];
  const mIdxs = curMatch.filter(n=>n!=="__BYE__").map(n=>teams.findIndex(t=>t.name===n));
  const mTeams = mIdxs.map(i=>teams[i]).filter(Boolean);
  const getTeamLetter = (globalIdx) => String.fromCharCode(65 + globalIdx);

  const persistGameState = useCallback(() => {
    const gameState = { teams, usedIds, roundMatches, matchIdx, roundName, roundDone, history, curRoundData, log, fStage, fLevel, curQ, showAns, resolved, running, tkey, extraTime, sel, hiddenOptions, responseMode, activeResponderTeamIdx, matchActive };
    localStorage.setItem(gameStateKey, JSON.stringify(gameState));
  }, [teams, usedIds, roundMatches, matchIdx, roundName, roundDone, history, curRoundData, log, fStage, fLevel, curQ, showAns, resolved, running, tkey, extraTime, sel, hiddenOptions, responseMode, activeResponderTeamIdx, matchActive, gameStateKey]);
  useEffect(() => { const interval = setInterval(() => { if (matchActive) persistGameState(); }, 30000); return () => clearInterval(interval); }, [persistGameState, matchActive]);
  useEffect(() => { if (matchActive) persistGameState(); }, [teams, usedIds, roundMatches, matchIdx, roundName, roundDone, history, curRoundData, matchActive, persistGameState, curQ, showAns, resolved, running, tkey, extraTime, sel, hiddenOptions, responseMode, activeResponderTeamIdx]);

  const addLog = msg => setLog(l=>[{time:new Date().toLocaleTimeString(),msg},...l.slice(0,29)]);
  const triggerAnim = (ti, pts) => { const el = teamCardRefs.current[ti]; if (!el) return; const rect = el.getBoundingClientRect(); const col = pts > 0 ? C.primary : C.error; setScoreAnims(a=>[...a, {id:Date.now()+Math.random(), pts, col, x: rect.left + rect.width/2 - 20, y: rect.top - 10}]); };
  const removeAnim = id => setScoreAnims(a=>a.filter(x=>x.id!==id));
  const getRoundName = remCount => { if (remCount <= 2) return "Final"; if (remCount <= 4) return "Semifinal"; if (remCount <= 8) return "Cuartos de Final"; return "Ronda Inicial"; };
  const genMatches = () => {
    const names = active.map(t=>t.name); let rr = [...names]; const hasBye = rr.length % 2 === 1; if (hasBye) rr.push("__BYE__"); const n = rr.length; const m = [];
    for (let r = 0; r < n - 1; r++) { for (let i = 0; i < n / 2; i++) { const t1 = rr[i], t2 = rr[n - 1 - i]; if (t1 === "__BYE__") m.push([t2, "__BYE__"]); else if (t2 === "__BYE__") m.push([t1, "__BYE__"]); else m.push([t1, t2]); } rr = [rr[0], rr[n-1], ...rr.slice(1, n-1)]; }

          <button onClick={openProjector} style={{ flex:1, background: projectorActive ? `${C.error}20` : `${C.secondary}20`, border: `1px solid ${projectorActive ? C.error : C.secondary}`, color: projectorActive ? C.error : C.secondary, borderRadius: 40, padding:"8px", fontSize:12, fontWeight:700, cursor:"pointer" }}>{projectorActive ? "✕ Cerrar proyector" : "⛶ Abrir proyector"}</button> 
          <button onClick={manualSave} style={{ flex:1, background: `${C.primary}20`, border: `1px solid ${C.primary}`, color: C.primary, borderRadius: 40, padding:"8px", fontSize:12, fontWeight:700, cursor:"pointer" }}>💾 Guardar</button> 
          <button onClick={newGame} style={{ flex:1, background: `${C.error}20`, border: `1px solid ${C.error}`, color: C.error, borderRadius: 40, padding:"8px", fontSize:12, fontWeight:700, cursor:"pointer" }}>🔄 Nueva</button> 
          <button onClick={toggleMusic} style={{ background: musicOn ? C.primary : C.surfaceContainerHigh, color: musicOn ? C.onPrimary : C.secondary, border: `1px solid ${musicOn ? C.primary : C.secondary}`, borderRadius: 40, padding: "8px 12px", fontSize: 14, cursor: "pointer", width: "auto" }} title={musicOn ? "Detener música" : "Iniciar música"}>{musicOn ? "🎶" : "🎵"}</button>
        </div> 
        <div style={{ background: C.surfaceContainer, borderRadius: 20, padding: 12, flex:1, overflowY:"auto", minHeight: 100 }}> 
          <div style={{ fontSize: 9, color: C.outline, letterSpacing:1, marginBottom:4 }}>REGISTRO</div> 
          {log.map((l,i)=>( <div key={i} style={{ fontSize: 10, color: i===0 ? C.onSurface : C.outline, padding:"2px 0", borderBottom: `1px solid ${C.outlineVariant}` }}><span style={{ color: C.outline, marginRight: 6, fontSize:9 }}>{l.time}</span>{l.msg}</div> ))} 
        </div> 
      </div>
      <div style={{ overflowY:"auto" }}> <TournamentMgr teams={teams} onStartMatch={startMatch} currentMatchIdx={matchIdx} roundMatches={roundMatches} onEliminateLowest={elimLowest} roundName={roundName} roundComplete={roundDone} history={history} onShowWait={()=>setShowWait(true)} onTieBreaker={()=>setShowTie(true)}/> {!matchActive && ( <button onClick={genMatches} style={{ width:"100%", background: `${C.secondary}20`, color: C.secondary, border: `1px solid ${C.secondary}`, borderRadius: 40, padding:"10px", fontSize:12, fontWeight:700, cursor:"pointer", marginTop:12 }}>⚡ Generar enfrentamientos</button> )} <div style={{ marginTop: 12, background: C.surfaceContainer, borderRadius: 20, padding: 12 }}> <div style={{ fontSize:9, color:C.outline, letterSpacing:1, marginBottom:8 }}>REFERENCIA</div> {[1,2,3].map(s=>( <div key={s} style={{ marginBottom: 8, padding:"6px 10px", borderRadius: 12, background: `${SC[s].color}10`, borderLeft: `4px solid ${SC[s].color}` }}> <div style={{ fontSize:9, color: SC[s].color, fontWeight:600 }}>Etapa {s}</div> <div style={{ fontSize:9, color:C.outline }}>⏱{SC[s].time}s · ✓+{SC[s].correct} · ✗{SC[s].incorrect}</div> </div> ))} </div> </div>
    </div>
  </> );
}

/* ═══════════════════════════════════════════════════════ TEAM SETUP (con logo pequeño en lugar de texto ACTIVATE) ══ */
function TeamSetup({teams, setTeams, onStart, onLoadGame, hasSave}) {
  const add = () => { if(teams.length>=8)return; setTeams(ts=>[...ts,makeTeam(`Equipo ${ts.length+1}`)]); };
  const rem = i => { if(teams.length<=2)return; setTeams(ts=>ts.filter((_,idx)=>idx!==i)); };
  const ren = (i,n) => setTeams(ts=>ts.map((t,idx)=>idx===i?{...t,name:n}:t));
  return ( <div style={{ maxWidth: 600, margin: "48px auto", background: C.surfaceContainer, borderRadius: 32, padding: 32, backdropFilter: "blur(8px)", border: `1px solid ${C.outlineVariant}` }}> <div style={{ textAlign:"center", marginBottom: 32 }}> <div style={{ fontFamily: "'Hanken Grotesk', sans-serif", fontSize: 36, fontWeight: 800, color: C.primary, letterSpacing: -1 }}>DILO COMO ES</div> <div style={{ fontSize: 13, color: C.outline, marginTop: 6, display: 'flex', justifyContent: 'center', alignItems: 'center', gap: 8 }}>
        <svg viewBox="0 0 3450 1313" style={{ height: '24px', width: 'auto' }}><use href="#logo-svg-defs" /></svg>
        <span>– Configuración</span>
      </div> </div> <div style={{ marginBottom: 24 }}> <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom: 16 }}> <div style={{ fontSize: 12, color: C.secondary, fontWeight: 700, letterSpacing:1 }}>EQUIPOS ({teams.length})</div> <div style={{ display:"flex", gap: 8 }}> <button onClick={add} disabled={teams.length>=8} style={{ background: teams.length>=8 ? C.outlineVariant : `${C.primary}20`, color: teams.length>=8 ? C.outline : C.primary, border: `1px solid ${teams.length>=8 ? C.outlineVariant : C.primary}`, borderRadius: 40, padding:"6px 16px", fontSize:11, fontWeight:600, cursor: teams.length>=8 ? "default" : "pointer" }}>+ Agregar</button> {hasSave && <button onClick={onLoadGame} style={{ background: `${C.tertiary}20`, color: C.tertiary, border: `1px solid ${C.tertiary}`, borderRadius: 40, padding:"6px 16px", fontSize:11, fontWeight:600, cursor:"pointer" }}>📂 Cargar última</button>} </div> </div> {teams.map((t,i)=>( <div key={i} style={{ display:"flex", alignItems:"center", gap: 12, marginBottom: 10 }}> <div style={{ width: 32, height: 32, borderRadius: "50%", background: `${TC[i%TC.length]}30`, border: `2px solid ${TC[i%TC.length]}`, display:"flex", alignItems:"center", justifyContent:"center", fontSize: 12, fontWeight: 800, color: TC[i%TC.length] }}>{String.fromCharCode(65+i)}</div> <input value={t.name} onChange={e=>ren(i,e.target.value)} style={{ flex:1, background: C.surfaceContainerHigh, border: `1px solid ${C.outlineVariant}`, borderRadius: 12, color: C.onSurface, fontSize: 13, padding:"8px 12px" }}/> <button onClick={()=>rem(i)} disabled={teams.length<=2} style={{ background: `${C.error}20`, color: C.error, border: `1px solid ${C.error}`, borderRadius: 40, width:32, height:32, fontSize:12, cursor: teams.length<=2 ? "default" : "pointer" }}>✕</button> </div> ))} </div> <button onClick={onStart} style={{ width:"100%", background: C.primary, color: C.onPrimary, border:"none", borderRadius: 48, padding:"14px", fontSize: 14, fontWeight: 800, cursor:"pointer", boxShadow: "0 0 15px #97df5c" }}>⚡ COMENZAR TORNEO</button> </div> );
}

/* ═══════════════════════════════════════════════════════ QManager (con persistencia y botón restablecer) ══ */
function QManager({questions, setQuestions, onExport, resetToDefault}) {
  const blank = {id:Date.now(),stage:1,text:"",options:["","","",""],answer:"A",level:1};
  const [form, setForm] = useState(blank);
  const [editId, setEditId] = useState(null);
  const sc = {1:C.secondary, 2:C.tertiary, 3:C.primary};
  const save = () => { if (!form.text.trim()) return; const q = {...form, id: editId||Date.now(), options: form.stage===1 ? form.options : null, answer:  form.stage===1 ? form.answer  : form.answer }; setQuestions(qs=>editId?qs.map(x=>x.id===editId?q:x):[...qs,q]); setForm({...blank, id:Date.now()}); setEditId(null); };
  const edit = q => { setForm({...q, options: q.options||["","","",""]}); setEditId(q.id); };
  const del = id => setQuestions(qs=>qs.filter(q=>q.id!==id));
  const imp = e => { const file = e.target.files[0]; if(!file) return; const r = new FileReader(); r.onload = ev => { try { setQuestions(JSON.parse(ev.target.result)); } catch {} }; r.readAsText(file); e.target.value=""; };
  return ( <div style={{ display:"grid", gridTemplateColumns:"340px 1fr", gap: 16, height:"calc(100vh - 80px)", padding:"0 24px" }}> <div style={{ background: C.surfaceContainer, borderRadius: 24, padding: 16, overflowY:"auto", backdropFilter:"blur(4px)" }}> <div style={{ fontSize:12, color:C.secondary, fontWeight:700, letterSpacing:1, marginBottom:12 }}>{editId?"EDITAR PREGUNTA":"NUEVA PREGUNTA"}</div> <div style={{ marginBottom:12 }}> <div style={{ fontSize:9, color:C.outline, marginBottom:4 }}>ETAPA</div> <div style={{ display:"flex", gap:6 }}> {[1,2,3].map(s=>( <button key={s} onClick={()=>setForm(f=>({...f,stage:s}))} style={{ flex:1, background:form.stage===s ? `${sc[s]}20` : "transparent", border:`1px solid ${form.stage===s ? sc[s] : C.outlineVariant}`, color: form.stage===s ? sc[s] : C.outline, borderRadius:40, padding:"5px", fontSize:10, cursor:"pointer" }}>E{s}</button> ))} </div> </div> <div style={{ marginBottom:12 }}> <div style={{ fontSize:9, color:C.outline, marginBottom:4 }}>NIVEL</div> <div style={{ display:"flex", gap:6 }}> {[1,2].map(l=>( <button key={l} onClick={()=>setForm(f=>({...f,level:l}))} style={{ flex:1, background:form.level===l ? `${C.primary}20` : "transparent", border:`1px solid ${form.level===l ? C.primary : C.outlineVariant}`, color: form.level===l ? C.primary : C.outline, borderRadius:40, padding:"5px", fontSize:10, cursor:"pointer" }}>{l===1?"Club Bíblico":"Líderes"}</button> ))} </div> </div> <div style={{ marginBottom:12 }}> <div style={{ fontSize:9, color:C.outline, marginBottom:4 }}>PREGUNTA</div> <textarea value={form.text} onChange={e=>setForm(f=>({...f,text:e.target.value}))} rows={3} style={{ width:"100%", background:C.surfaceContainerHigh, border:`1px solid ${C.outlineVariant}`, borderRadius:12, color:C.onSurface, fontSize:11, padding:"8px 10px", resize:"vertical" }}/> </div> {form.stage===1 && ( <div style={{ marginBottom:12 }}> <div style={{ fontSize:9, color:C.outline, marginBottom:4 }}>OPCIONES</div> {["A","B","C","D"].map((l,i)=>( <div key={l} style={{ display:"flex", alignItems:"center", gap:6, marginBottom:6 }}> <span style={{ width:24, height:24, borderRadius:"50%", background:"rgba(255,255,255,0.1)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:10, fontWeight:700 }}>{l}</span> <input value={form.options[i]||""} onChange={e=>{const o=[...form.options];o[i]=e.target.value;setForm(f=>({...f,options:o}));}} style={{ flex:1, background:C.surfaceContainerHigh, border:`1px solid ${form.answer===l ? C.primary : C.outlineVariant}`, borderRadius:8, color:C.onSurface, fontSize:10, padding:"5px 8px" }}/> <button onClick={()=>setForm(f=>({...f,answer:l}))} style={{ width:24, height:24, borderRadius:"50%", background:form.answer===l ? C.primary : "transparent", border:`1px solid ${form.answer===l ? C.primary : C.outlineVariant}`, color: form.answer===l ? C.onPrimary : C.outline, fontSize:9, cursor:"pointer" }}>✓</button> </div> ))} </div> )} {form.stage!==1 && ( <div style={{ marginBottom:12 }}> <div style={{ fontSize:9, color:C.outline, marginBottom:4 }}>RESPUESTA CORRECTA</div> <textarea value={form.answer} onChange={e=>setForm(f=>({...f,answer:e.target.value}))} rows={2} style={{ width:"100%", background:C.surfaceContainerHigh, border:`1px solid ${C.outlineVariant}`, borderRadius:12, color:C.onSurface, fontSize:11, padding:"8px 10px" }}/> </div> )} <div style={{ display:"flex", gap:8, marginTop:8 }}> <button onClick={save} style={{ flex:1, background:C.primary, color:C.onPrimary, border:"none", borderRadius:40, padding:"8px", fontSize:11, fontWeight:700, cursor:"pointer" }}>{editId?"💾 Actualizar":"+ Agregar"}</button> {editId && <button onClick={()=>{setForm({...blank,id:Date.now()});setEditId(null);}} style={{ background:"transparent", color:C.outline, border:`1px solid ${C.outlineVariant}`, borderRadius:40, padding:"8px", fontSize:11, cursor:"pointer" }}>✕</button>} </div> <div style={{ display:"flex", gap:8, marginTop:12 }}> <button onClick={onExport} style={{ flex:1, background: `${C.secondary}20`, color: C.secondary, border:`1px solid ${C.secondary}`, borderRadius:40, padding:"6px", fontSize:10, fontWeight:600, cursor:"pointer" }}>⬇ Exportar JSON</button> <label style={{ flex:1, background: `${C.tertiary}20`, color: C.tertiary, border:`1px solid ${C.tertiary}`, borderRadius:40, padding:"6px", fontSize:10, fontWeight:600, cursor:"pointer", textAlign:"center" }}> ⬆ Importar JSON <input type="file" accept=".json" onChange={imp} style={{display:"none"}}/> </label> </div> <div style={{ display:"flex", gap:8, marginTop:12 }}> <button onClick={resetToDefault} style={{ flex:1, background: `${C.warn}20`, color: C.warn, border:`1px solid ${C.warn}`, borderRadius:40, padding:"6px", fontSize:10, fontWeight:600, cursor:"pointer" }}>⟳ Restablecer predeterminadas</button> </div> <div style={{ fontSize:9, color:C.outline, textAlign:"center", marginTop:12 }}>{questions.length} preguntas</div> </div> <div style={{ background: C.surfaceContainer, borderRadius: 24, padding: 16, overflowY:"auto" }}> <div style={{ fontSize:12, color:C.secondary, fontWeight:700, marginBottom:12 }}>BANCO DE PREGUNTAS</div> {[1,2,3].map(stage=>{ const qs=questions.filter(q=>q.stage===stage); if(!qs.length) return null; return( <div key={stage} style={{ marginBottom:16 }}> <div style={{ fontSize:10, color:sc[stage], letterSpacing:1, marginBottom:6 }}>{SC[stage].label.toUpperCase()} ({qs.length})</div> {qs.map(q=> ( <div key={q.id} style={{ background: C.surfaceContainerHigh, borderRadius: 12, padding:"8px 10px", marginBottom:6, borderLeft: `4px solid ${sc[stage]}` }}> <div style={{ fontSize:11 }}>{q.text}</div> <div style={{ fontSize:9, color:C.outline, marginTop:2 }}>Nv{q.level} · {q.answer?.substring(0,35)}</div> <div style={{ display:"flex", gap:6, marginTop:6 }}> <button onClick={()=>edit(q)} style={{ background: `${C.secondary}20`, border:"none", borderRadius:40, padding:"2px 12px", fontSize:9, cursor:"pointer" }}>Editar</button> <button onClick={()=>del(q.id)} style={{ background: `${C.error}20`, border:"none", borderRadius:40, padding:"2px 12px", fontSize:9, cursor:"pointer" }}>✕</button> </div> </div> ))} </div> ); })} </div> </div> );
}

/* ═══════════════════════════════════════════════════════ APP (con persistencia de preguntas y logo) ══ */
function App() {
  const [tab, setTab] = useState("setup");
  const QUESTIONS_STORAGE_KEY = "dilo_como_es_questions";
  const [questions, setQuestions] = useState(() => {
    const saved = localStorage.getItem(QUESTIONS_STORAGE_KEY);
    if (saved) {
      try {
        return JSON.parse(saved);
      } catch(e) { return DEMO_Q; }
    }
    return DEMO_Q;
  });
  useEffect(() => {
    localStorage.setItem(QUESTIONS_STORAGE_KEY, JSON.stringify(questions));
  }, [questions]);
  const resetQuestionsToDefault = () => { setQuestions(DEMO_Q); };
  const [teams, setTeams] = useState([ makeTeam("Equipo Alfa"), makeTeam("Equipo Beta"), makeTeam("Equipo Gamma"), makeTeam("Equipo Delta") ]);
  const [started, setStarted] = useState(false);
  const [savedGameData, setSavedGameData] = useState(null);
  const GAME_STATE_KEY = "dilo_como_es_save";
  useEffect(() => { const saved = localStorage.getItem(GAME_STATE_KEY); if (saved) try { setSavedGameData(JSON.parse(saved)); } catch(e) {} }, []);
  const startNewGame = () => { setStarted(true); setTab("game"); };
  const restoreGame = () => { setStarted(true); setTab("game"); };
  const resetGame = () => { setStarted(false); setTeams([ makeTeam("Equipo Alfa"), makeTeam("Equipo Beta"), makeTeam("Equipo Gamma"), makeTeam("Equipo Delta") ]); setTab("setup"); };
  const active = teams.filter(t=>!t.eliminated);
  const exportQ = () => { const blob = new Blob([JSON.stringify(questions,null,2)],{type:"application/json"}); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `preguntas_activate_${new Date().toISOString().slice(0,10)}.json`; a.click(); };
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('projector') === '1') return <ProjectorView />;
  if (savedGameData && !started) return ( <div style={{ background: C.bg, height: "100vh", display:"flex", alignItems:"center", justifyContent:"center" }}> <div style={{ background: C.surfaceContainer, borderRadius: 32, padding: 40, maxWidth: 500, textAlign:"center", backdropFilter:"blur(8px)" }}> <div style={{ fontFamily: "'Hanken Grotesk', sans-serif", fontSize: 28, fontWeight: 800, color: C.primary, marginBottom: 16 }}>DILO COMO ES</div> <div style={{ fontSize: 14, color: C.outline, marginBottom: 24 }}>Partida guardada encontrada</div> <div style={{ background: C.surfaceContainerHigh, borderRadius: 20, padding: 16, marginBottom: 24, textAlign:"left" }}> <div style={{ fontSize: 12, color: C.secondary }}>Resumen:</div> <div style={{ fontSize: 11 }}>Ronda: {savedGameData.roundName}</div> <div style={{ fontSize: 11 }}>Equipos activos: {savedGameData.teams.filter(t=>!t.eliminated).length}</div> </div> <div style={{ display:"flex", gap: 12 }}> <button onClick={restoreGame} style={{ flex:1, background: C.primary, color: C.onPrimary, border:"none", borderRadius: 40, padding:"12px", fontWeight:700, cursor:"pointer" }}>▶ Restaurar</button> <button onClick={()=>{localStorage.removeItem(GAME_STATE_KEY); setSavedGameData(null);}} style={{ flex:1, background: "transparent", border: `1px solid ${C.outlineVariant}`, color: C.outline, borderRadius: 40, padding:"12px", fontWeight:600, cursor:"pointer" }}>🔄 Nueva</button> </div> </div> </div> );
  return ( <div style={{ background: C.bg, height: "100vh", display: "flex", flexDirection: "column" }}> <div style={{ background: C.surfaceContainerLowest, padding: "0 24px", display:"flex", alignItems:"center", borderBottom: `2px solid ${C.primary}`, flexShrink:0 }}> <div style={{ display:"flex", alignItems:"center", gap:12, padding:"8px 0", marginRight:24 }}>
        <svg viewBox="0 0 3450 1313" style={{ height: '24px', width: 'auto' }}><use href="#logo-svg-defs" /></svg>
        <div style={{ fontWeight:600, color: C.onSurface }}>Dilo Como Es!</div>
      </div> {started ? ( <> {[["game","🎮 Juego"],["questions","📋 Preguntas"],["sound","🎵 Sonidos"]].map(([id,lbl])=>( <button key={id} onClick={()=>setTab(id)} style={{ background: tab===id ? `${C.primary}20` : "transparent", color: tab===id ? C.primary : C.outline, border: "none", borderBottom: tab===id ? `2px solid ${C.primary}` : "2px solid transparent", padding:"12px 20px", fontSize:12, cursor:"pointer", fontWeight: tab===id ? 600 : 400 }}>{lbl}</button> ))} <div style={{ marginLeft:"auto", display:"flex", gap: 12, alignItems:"center" }}> <span style={{ fontSize:10, color:C.outline }}>{active.length} activos</span> {active.slice(0,2).map((t,i)=>{ const idx=teams.findIndex(x=>x.name===t.name); return <span key={i} style={{ fontSize:11, color:TC[idx%TC.length], fontWeight:600 }}>{t.name}: {t.score}</span>; })} <button onClick={resetGame} style={{ background: `${C.error}20`, color: C.error, border: `1px solid ${C.error}`, borderRadius: 40, padding:"4px 12px", fontSize:10, cursor:"pointer" }}>Reiniciar</button> </div> </> ) : ( [["setup","⚙️ Equipos"],["questions","📋 Preguntas"]].map(([id,lbl])=>( <button key={id} onClick={()=>setTab(id)} style={{ background: tab===id ? `${C.primary}20` : "transparent", color: tab===id ? C.primary : C.outline, border: "none", borderBottom: tab===id ? `2px solid ${C.primary}` : "2px solid transparent", padding:"12px 20px", fontSize:12, cursor:"pointer" }}>{lbl}</button> )) )} </div> <div style={{ flex:1, padding:"20px 24px", overflowY:"auto" }}> {tab==="setup" && <TeamSetup teams={teams} setTeams={setTeams} onStart={startNewGame} onLoadGame={restoreGame} hasSave={!!savedGameData}/>} {tab==="questions" && <QManager questions={questions} setQuestions={setQuestions} onExport={exportQ} resetToDefault={resetQuestionsToDefault}/>} {tab==="game" && started && <GameView questions={questions} teams={teams} setTeams={setTeams} initialState={savedGameData} gameStateKey={GAME_STATE_KEY}/>} {tab==="sound" && <SoundManager />} </div> </div> );
}

// Root con pantalla de carga
function Root() {
  const [audioReady, setAudioReady] = useState(false);
  useEffect(() => {
    AudioEngine.init().then(() => setAudioReady(true));
  }, []);
  if (!audioReady) {
    return <div style={{ background: C.bg, height: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', color: C.onSurface, fontSize: 20 }}>Cargando sonidos...</div>;
  }
  // Al iniciar la app, comenzar música de inicio
  AudioEngine.startMusic('start');
  return (
    <>
      <LogoSymbol />
      <App />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
</body>
