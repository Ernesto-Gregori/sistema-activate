<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔧 Debugger – Dilo Como Es ACTIVATE 2026</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #060e15; --surface: #0f1c26; --surface2: #162230; --surface3: #1e2e3c;
    --border: #243545; --text: #c8daea; --muted: #5a7a90;
    --green: #5ecf6a; --green-dim: #1a3d1e; --green-bright: #97df5c;
    --blue: #4ab0e8; --blue-dim: #0d2a3f;
    --yellow: #e8b84a; --yellow-dim: #3a2a0a;
    --red: #e85a5a; --red-dim: #3a0f0f;
    --purple: #b07aed; --purple-dim: #2a1a3f;
    --mono: 'JetBrains Mono', 'Fira Mono', monospace;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
  
  /* ── Top bar ── */
  #topbar { display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap; }
  #topbar h1 { font-size: 14px; font-weight: 700; color: var(--green-bright); letter-spacing: 0.5px; white-space: nowrap; }
  .status-pill { display: flex; align-items: center; gap: 6px; background: var(--surface3); border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; font-size: 11px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
  .dot.on { background: var(--green); box-shadow: 0 0 6px var(--green); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  #topbar button { background: var(--surface3); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 5px 12px; font-size: 11px; cursor: pointer; transition: 0.15s; white-space: nowrap; }
  #topbar button:hover { border-color: var(--blue); color: var(--blue); }
  #topbar button.danger { border-color: var(--red); color: var(--red); }
  #topbar button.danger:hover { background: var(--red-dim); }
  .spacer { flex: 1; }

  /* ── Layout ── */
  #layout { display: grid; grid-template-columns: 260px 1fr 280px; grid-template-rows: 1fr 200px; gap: 1px; flex: 1; overflow: hidden; background: var(--border); }
  #layout > section { background: var(--bg); overflow: hidden; display: flex; flex-direction: column; }

  /* ── Section headers ── */
  .sec-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--border); font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: var(--muted); flex-shrink: 0; }
  .sec-head span.badge { background: var(--surface3); border-radius: 20px; padding: 1px 8px; font-size: 9px; color: var(--blue); }
  .sec-body { flex: 1; overflow-y: auto; padding: 10px 12px; }

  /* ── State tree ── */
  .kv { display: flex; gap: 6px; align-items: flex-start; margin-bottom: 4px; }
  .kv .k { color: var(--blue); font-family: var(--mono); font-size: 11px; min-width: 130px; flex-shrink: 0; }
  .kv .v { color: var(--text); font-family: var(--mono); font-size: 11px; word-break: break-all; }
  .kv .v.ok { color: var(--green); }
  .kv .v.warn { color: var(--yellow); }
  .kv .v.err { color: var(--red); }
  .kv .v.null { color: var(--muted); font-style: italic; }
  .group { margin-bottom: 10px; }
  .group-title { font-size: 9px; font-weight: 700; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }

  /* ── Teams grid ── */
  .team-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 8px; transition: 0.2s; }
  .team-card.active { border-color: var(--green-bright); }
  .team-card.eliminated { opacity: 0.45; border-style: dashed; }
  .team-card.in-match { border-color: var(--blue); background: var(--blue-dim); }
  .team-name { font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .team-score { font-family: var(--mono); font-size: 20px; font-weight: 700; color: var(--green-bright); }
  .team-meta { display: flex; gap: 8px; margin-top: 5px; flex-wrap: wrap; }
  .tag { background: var(--surface3); border-radius: 4px; padding: 1px 6px; font-size: 10px; font-family: var(--mono); }
  .tag.green { color: var(--green); }
  .tag.red { color: var(--red); }
  .tag.blue { color: var(--blue); }
  .tag.yellow { color: var(--yellow); }

  /* ── Event log ── */
  #log-section { grid-column: 1 / 4; }
  .log-line { display: flex; gap: 10px; align-items: baseline; padding: 3px 0; border-bottom: 1px solid var(--border)10; font-family: var(--mono); font-size: 11px; }
  .log-line:first-child { color: var(--text); }
  .log-line:not(:first-child) { color: var(--muted); }
  .log-time { color: var(--muted); font-size: 10px; min-width: 72px; flex-shrink: 0; }
  .log-type { min-width: 80px; font-size: 10px; padding: 1px 6px; border-radius: 4px; text-align: center; flex-shrink: 0; }
  .log-type.state   { background: var(--blue-dim);   color: var(--blue); }
  .log-type.cmd     { background: var(--purple-dim);  color: var(--purple); }
  .log-type.projector { background: var(--green-dim); color: var(--green); }
  .log-type.error   { background: var(--red-dim);     color: var(--red); }
  .log-type.info    { background: var(--surface3);    color: var(--muted); }
  .log-type.warn    { background: var(--yellow-dim);  color: var(--yellow); }
  .log-msg { flex: 1; }

  /* ── Projector panel ── */
  .proj-check { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; font-size: 11px; }
  .proj-check .icon { font-size: 14px; }
  .proj-check .label { flex: 1; color: var(--muted); }
  .proj-check .result { font-family: var(--mono); font-size: 11px; }
  .proj-check .result.ok { color: var(--green); }
  .proj-check .result.bad { color: var(--red); }
  .proj-check .result.warn { color: var(--yellow); }
  .proj-check .result.na { color: var(--muted); }

  /* ── Checks / tests ── */
  .test-btn { width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 7px 12px; font-size: 11px; cursor: pointer; text-align: left; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; transition: 0.15s; }
  .test-btn:hover { border-color: var(--yellow); color: var(--yellow); }
  .test-btn .result-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .test-btn .result-dot.pass { background: var(--green); box-shadow: 0 0 4px var(--green); }
  .test-btn .result-dot.fail { background: var(--red); box-shadow: 0 0 4px var(--red); }

  /* ── Scrollbars ── */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* ── IDB inspector ── */
  .idb-table { width: 100%; border-collapse: collapse; font-size: 10px; font-family: var(--mono); }
  .idb-table th { background: var(--surface3); color: var(--muted); padding: 4px 8px; text-align: left; font-size: 9px; letter-spacing: 1px; }
  .idb-table td { padding: 4px 8px; border-bottom: 1px solid var(--border); word-break: break-all; }
  .idb-table tr:hover td { background: var(--surface2); }

  /* ── Payload diff ── */
  .diff-box { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-top: 6px; font-family: var(--mono); font-size: 10px; white-space: pre-wrap; word-break: break-all; max-height: 160px; overflow-y: auto; color: var(--text); }

  .no-data { color: var(--muted); font-style: italic; font-size: 11px; text-align: center; padding: 20px; }

  /* ── Resize handle ── */
  #log-section { border-top: 2px solid var(--border); }
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <h1>🔧 Debugger — Dilo Como Es ACTIVATE 2026</h1>
  <div class="status-pill">
    <div class="dot" id="conn-dot"></div>
    <span id="conn-label">Sin conexión</span>
  </div>
  <div class="status-pill">
    <span style="color:var(--yellow)">📡</span>
    <span id="msg-counter">0 mensajes</span>
  </div>
  <div class="status-pill">
    <span id="projector-status" style="color:var(--muted)">🖥️ Proyector: —</span>
  </div>
  <button onclick="clearLog()">🗑 Limpiar log</button>
  <button onclick="runAllChecks()">▶ Ejecutar todos los tests</button>
  <button onclick="exportLog()" class="danger">📥 Exportar log</button>
  <div class="spacer"></div>
  <span style="color:var(--muted);font-size:10px" id="last-update">—</span>
</div>

<!-- MAIN LAYOUT -->
<div id="layout">

  <!-- COL 1: Teams + State -->
  <section id="col-teams">
    <div class="sec-head">👥 EQUIPOS <span class="badge" id="teams-badge">0</span></div>
    <div class="sec-body" id="teams-body"><div class="no-data">Esperando datos del juego…</div></div>
  </section>

  <!-- COL 2: State inspector -->
  <section id="col-state">
    <div class="sec-head" style="justify-content:space-between">
      <span>🔬 ESTADO DEL JUEGO</span>
      <div style="display:flex;gap:6px">
        <button onclick="toggleRaw()" style="background:var(--surface3);border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:2px 8px;font-size:10px;cursor:pointer" id="raw-btn">RAW</button>
      </div>
    </div>
    <div class="sec-body" id="state-body"><div class="no-data">Esperando datos del juego…</div></div>
  </section>

  <!-- COL 3: Checks + Projector -->
  <section id="col-checks">
    <div class="sec-head">✅ TESTS & PROYECTOR</div>
    <div class="sec-body" id="checks-body">
      <div class="group-title">Tests automáticos</div>
      <button class="test-btn" onclick="runCheck('timer')" id="test-timer">⏱ Timer activo <span class="result-dot" id="dot-timer"></span></button>
      <button class="test-btn" onclick="runCheck('loop')" id="test-loop">🔁 Sin loop infinito <span class="result-dot" id="dot-loop"></span></button>
      <button class="test-btn" onclick="runCheck('projector_conn')" id="test-projector_conn">🖥️ Proyector conectado <span class="result-dot" id="dot-projector_conn"></span></button>
      <button class="test-btn" onclick="runCheck('projector_sync')" id="test-projector_sync">📡 Payload enviado <span class="result-dot" id="dot-projector_sync"></span></button>
      <button class="test-btn" onclick="runCheck('teams_valid')" id="test-teams_valid">👥 Equipos válidos <span class="result-dot" id="dot-teams_valid"></span></button>
      <button class="test-btn" onclick="runCheck('curq_valid')" id="test-curq_valid">❓ Pregunta actual válida <span class="result-dot" id="dot-curq_valid"></span></button>
      <button class="test-btn" onclick="runCheck('winner_logic')" id="test-winner_logic">🏆 Lógica de ganador <span class="result-dot" id="dot-winner_logic"></span></button>
      <button class="test-btn" onclick="runCheck('idb')" id="test-idb">💾 IndexedDB accesible <span class="result-dot" id="dot-idb"></span></button>
      <button class="test-btn" onclick="runCheck('audio')" id="test-audio">🔊 AudioContext activo <span class="result-dot" id="dot-audio"></span></button>
      <button class="test-btn" onclick="runCheck('broadcast')" id="test-broadcast">📻 BroadcastChannel <span class="result-dot" id="dot-broadcast"></span></button>
      <button class="test-btn" onclick="runCheck('voice')" id="test-voice">🎤 Reconocimiento de voz <span class="result-dot" id="dot-voice"></span></button>

      <div class="group-title" style="margin-top:14px">Estado del proyector</div>
      <div id="projector-checks"></div>

      <div class="group-title" style="margin-top:14px">IndexedDB</div>
      <div id="idb-info"><div class="no-data">—</div></div>

      <div class="group-title" style="margin-top:14px">Último payload enviado</div>
      <div id="payload-diff" class="diff-box" style="min-height:40px;color:var(--muted)">—</div>
    </div>
  </section>

  <!-- BOTTOM: Event log (spans all 3 cols) -->
  <section id="log-section">
    <div class="sec-head" style="justify-content:space-between">
      <span>📜 LOG DE EVENTOS <span class="badge" id="log-badge">0</span></span>
      <div style="display:flex;gap:6px;align-items:center">
        <label style="font-size:10px;color:var(--muted);display:flex;gap:4px;align-items:center">
          <input type="checkbox" id="filter-state" checked onchange="renderLog()"> Estado
        </label>
        <label style="font-size:10px;color:var(--muted);display:flex;gap:4px;align-items:center">
          <input type="checkbox" id="filter-cmd" checked onchange="renderLog()"> Comandos
        </label>
        <label style="font-size:10px;color:var(--muted);display:flex;gap:4px;align-items:center">
          <input type="checkbox" id="filter-projector" checked onchange="renderLog()"> Proyector
        </label>
        <label style="font-size:10px;color:var(--muted);display:flex;gap:4px;align-items:center">
          <input type="checkbox" id="filter-error" checked onchange="renderLog()"> Errores
        </label>
        <button onclick="clearLog()" style="background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:2px 8px;font-size:10px;cursor:pointer">Limpiar</button>
      </div>
    </div>
    <div class="sec-body" id="log-body" style="padding:6px 12px"></div>
  </section>

</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────────────────────────────────────────
let gameState = null;
let lastPayload = null;
let msgCount = 0;
let msgPerSecCount = 0;
let logEntries = [];
let showRaw = false;
let projectorConnected = false;
let lastPayloadTime = null;
let broadcastChannel = null;

// Monitor de rate — detecta loops infinitos
setInterval(() => {
  const rate = msgPerSecCount;
  msgPerSecCount = 0;
  if (rate > 0) {
    const rateEl = document.getElementById('msg-counter');
    rateEl.textContent = `${msgCount} msgs (${rate}/s)`;
    if (rate > 15) {
      rateEl.style.color = 'var(--red)';
      rateEl.title = '⚠️ Más de 15 mensajes/s — posible loop infinito en useEffect';
      if (rate > 30 && !document.getElementById('loop-warn')) {
        addLog('error', `⚠️ LOOP INFINITO DETECTADO: ${rate} mensajes/seg — revisar dependencias de useEffect`);
        const w = document.createElement('div');
        w.id = 'loop-warn';
        w.style.cssText = 'position:fixed;top:52px;left:50%;transform:translateX(-50%);background:#3a0f0f;border:2px solid var(--red);color:var(--red);padding:8px 20px;border-radius:8px;font-size:12px;font-weight:700;z-index:9999;';
        w.textContent = `⚠️ Loop detectado: ${rate} msg/s`;
        document.body.appendChild(w);
        setTimeout(() => w.remove(), 5000);
      }
    } else {
      rateEl.style.color = '';
      rateEl.title = '';
    }
  }
}, 1000);

// ─────────────────────────────────────────────────────────────────────────────
//  CONNECTION — BroadcastChannel (intercepts commands sent from RemoteControl)
//  + BroadcastChannel dilo_debugger (receives game state in real time)
// ─────────────────────────────────────────────────────────────────────────────
function initBroadcast() {
  // Canal de control remoto — espiar comandos enviados
  try {
    broadcastChannel = new BroadcastChannel('dilocontrol');
    broadcastChannel.onmessage = (e) => {
      addLog('cmd', `BroadcastChannel → ${JSON.stringify(e.data)}`);
    };
    addLog('info', 'BroadcastChannel "dilocontrol" escuchando comandos');
  } catch(err) {
    addLog('error', 'BroadcastChannel "dilocontrol" falló: ' + err.message);
  }

  // Canal del debugger — recibe el estado del juego en tiempo real
  try {
    const debugChannel = new BroadcastChannel('dilo_debugger');
    debugChannel.onmessage = (e) => {
      if (!e.data) return;
      msgCount++;
      document.getElementById('msg-counter').textContent = msgCount + ' mensajes';
      if (e.data.type === 'PROJECTOR_UPDATE') {
        lastPayload = e.data.payload;
        lastPayloadTime = new Date();
        projectorConnected = true;
        gameState = e.data.payload;
        // Detectar loop infinito: más de 10 mensajes por segundo es señal de bug
        msgPerSecCount++;
        addLog('projector', `STATE recibido — ${Object.keys(e.data.payload).length} claves, equipos: ${(e.data.payload.teams||[]).length}`);
        updateAll();
        updateConnectionStatus(true);
      }
    };
    addLog('info', 'BroadcastChannel "dilo_debugger" listo — esperando el juego');
  } catch(err) {
    addLog('error', 'BroadcastChannel "dilo_debugger" falló: ' + err.message);
  }
}

// Intercept postMessage (para cuando proyector y debugger están en misma origin)
window.addEventListener('message', (e) => {
  if (!e.data) return;
  const t = e.data.type;
  if (t === 'PROJECTOR_UPDATE') {
    msgCount++;
    document.getElementById('msg-counter').textContent = msgCount + ' mensajes';
    lastPayload = e.data.payload;
    lastPayloadTime = new Date();
    projectorConnected = true;
    gameState = e.data.payload;
    addLog('projector', `postMessage PROJECTOR_UPDATE — ${Object.keys(e.data.payload).length} claves`);
    updateAll();
  } else if (t === 'PROJECTOR_READY') {
    projectorConnected = true;
    addLog('projector', 'PROJECTOR_READY — proyector abierto y listo');
    updateConnectionStatus(true);
  }
});

// Spy on BroadcastChannel commands sent TO the game
function sendTestCommand(cmd) {
  if (broadcastChannel) {
    broadcastChannel.postMessage({ command: cmd });
    addLog('cmd', `Test command enviado: ${cmd}`);
  }
}

// ─────────────────────────────────────────────────────────────────────────────
//  CONNECTION STATUS
// ─────────────────────────────────────────────────────────────────────────────
function updateConnectionStatus(connected) {
  const dot = document.getElementById('conn-dot');
  const label = document.getElementById('conn-label');
  if (connected) {
    dot.classList.add('on');
    label.textContent = 'Conectado';
    label.style.color = 'var(--green)';
  } else {
    dot.classList.remove('on');
    label.textContent = 'Sin conexión';
    label.style.color = 'var(--red)';
  }
}

// Poll: check if main game window is accessible
setInterval(() => {
  const hasData = gameState !== null;
  updateConnectionStatus(hasData || projectorConnected);
  if (lastPayloadTime) {
    const sec = Math.round((Date.now() - lastPayloadTime) / 1000);
    document.getElementById('last-update').textContent = `Último update: ${sec}s atrás`;
  }
}, 1000);

// ─────────────────────────────────────────────────────────────────────────────
//  RENDER ALL
// ─────────────────────────────────────────────────────────────────────────────
function updateAll() {
  renderTeams();
  renderState();
  renderProjectorChecks();
  renderPayloadDiff();
  document.getElementById('last-update').textContent = `Último update: ${new Date().toLocaleTimeString()}`;
}

// ─────────────────────────────────────────────────────────────────────────────
//  TEAMS
// ─────────────────────────────────────────────────────────────────────────────
function renderTeams() {
  const el = document.getElementById('teams-body');
  const badge = document.getElementById('teams-badge');
  if (!gameState || !gameState.teams || gameState.teams.length === 0) {
    el.innerHTML = '<div class="no-data">Sin equipos recibidos</div>';
    badge.textContent = '0';
    return;
  }
  const teams = gameState.teams;
  const activeMatchIdxs = gameState.matchTeamIndices || [];
  badge.textContent = teams.filter(t => !t.eliminated).length + '/' + teams.length;

  el.innerHTML = [...teams].sort((a,b) => b.score - a.score).map((t, i) => {
    const isInMatch = gameState.activeMatchTeams && gameState.activeMatchTeams.some(m => m.name === t.name);
    const cls = t.eliminated ? 'eliminated' : isInMatch ? 'in-match active' : 'active';
    const jokers = t.jokers ? t.jokers.map((used, ji) => `<span class="tag ${used?'red':'green'}">${['50/50','Cap','Cmb'][ji]}${used?' ✗':' ✓'}</span>`).join('') : '';
    return `<div class="team-card ${cls}">
      <div class="team-name">
        <span>${t.avatar || '🏆'}</span>
        <span>${t.name}</span>
        ${t.eliminated ? '<span class="tag red">ELIMINADO</span>' : ''}
        ${isInMatch ? '<span class="tag blue">EN PARTIDO</span>' : ''}
      </div>
      <div class="team-score">${(t.score||0).toLocaleString()}</div>
      <div class="team-meta">
        <span class="tag yellow">🔥 ${t.streak||0}</span>
        ${jokers}
        ${t.pasoUsed ? '<span class="tag red">PASO ✗</span>' : '<span class="tag green">PASO ✓</span>'}
      </div>
    </div>`;
  }).join('');
}

// ─────────────────────────────────────────────────────────────────────────────
//  STATE INSPECTOR
// ─────────────────────────────────────────────────────────────────────────────
function renderState() {
  const el = document.getElementById('state-body');
  if (!gameState) {
    el.innerHTML = '<div class="no-data">Sin datos del juego</div>';
    return;
  }
  if (showRaw) {
    el.innerHTML = `<div class="diff-box" style="max-height:none">${JSON.stringify(gameState, null, 2)}</div>`;
    return;
  }
  const s = gameState;

  const kv = (k, v, cls='') => {
    let displayV = v;
    let vcls = cls;
    if (v === null || v === undefined) { displayV = 'null'; vcls = 'null'; }
    else if (v === true) { displayV = 'true'; vcls = 'ok'; }
    else if (v === false) { displayV = 'false'; vcls = 'warn'; }
    else if (typeof v === 'object') { displayV = JSON.stringify(v); }
    return `<div class="kv"><span class="k">${k}</span><span class="v ${vcls}">${escHtml(String(displayV))}</span></div>`;
  };

  const curQ = s.curQ;
  const stage = curQ ? `Etapa ${curQ.stage} (Nv${curQ.level})` : '—';
  const stageColor = curQ ? ['','var(--blue)','var(--yellow)','var(--green-bright)'][curQ.stage] : 'var(--muted)';

  el.innerHTML = `
    <div class="group">
      <div class="group-title">🎮 Partida</div>
      ${kv('roundName', s.roundName || '—')}
      ${kv('matchActive', s.running !== undefined ? '(ver timer)' : '—')}
      ${kv('responseMode', s.responseMode)}
      ${kv('activeResponder', s.activeResponderTeamIdx !== null && s.activeResponderTeamIdx !== undefined ? `Equipo [${s.activeResponderTeamIdx}]` : 'ninguno')}
      ${kv('projectorClear', s.projectorClear)}
      ${kv('showWait', s.showWait)}
      ${kv('showTie', s.showTie)}
      ${kv('winner', s.winner ? s.winner.name + ' (' + (s.winner.score||0).toLocaleString() + ' pts)' : null)}
    </div>
    <div class="group">
      <div class="group-title" style="color:${stageColor}">❓ Pregunta activa</div>
      ${curQ ? `
        ${kv('id', curQ.id)}
        ${kv('stage', stage)}
        ${kv('text', curQ.text ? curQ.text.substring(0,60)+'…' : '—')}
        ${kv('answer', curQ.answer)}
        ${kv('type', curQ.options ? 'Opción múltiple' : 'Respuesta abierta')}
        ${kv('hiddenOptions', s.hiddenOptions ? s.hiddenOptions.join(',') : 'ninguna')}
      ` : '<div class="kv"><span class="v null">Sin pregunta activa</span></div>'}
    </div>
    <div class="group">
      <div class="group-title">⏱ Timer</div>
      ${kv('running', s.running)}
      ${kv('remaining (tkey)', s.remaining)}
      ${kv('extraTime', s.extraTime || 0)}
      ${kv('resolved', s.resolved)}
      ${kv('showAnswer', s.showAnswer)}
    </div>
    <div class="group">
      <div class="group-title">🎯 Selecciones</div>
      ${s.sel && Object.keys(s.sel).length > 0
        ? Object.entries(s.sel).map(([ti, v]) => kv(`  equipo[${ti}]`, v)).join('')
        : '<div class="kv"><span class="v null">Sin selecciones</span></div>'}
    </div>
    <div class="group">
      <div class="group-title">⚡ Desempate</div>
      ${kv('showTie', s.showTie)}
      ${kv('tiePhase', s.tiePhase)}
      ${kv('tieWord', s.tieWord || '—')}
      ${kv('tieRunning', s.tieRunning)}
      ${kv('tieWinner', s.tieWinner !== null && s.tieWinner !== undefined ? `idx ${s.tieWinner}` : null)}
    </div>
    <div class="group">
      <div class="group-title">📋 Historial</div>
      ${kv('preguntas usadas', (s.questionHistory||[]).length)}
    </div>
  `;
}

// ─────────────────────────────────────────────────────────────────────────────
//  PROJECTOR CHECKS
// ─────────────────────────────────────────────────────────────────────────────
function renderProjectorChecks() {
  const el = document.getElementById('projector-checks');
  if (!lastPayload) {
    el.innerHTML = '<div class="no-data">Sin payload recibido aún</div>';
    document.getElementById('projector-status').textContent = '🖥️ Proyector: sin datos';
    return;
  }
  const p = lastPayload;
  const checks = [
    { icon:'🖥️', label:'Proyector conectado',     result: projectorConnected, ok: projectorConnected },
    { icon:'❓', label:'curQ enviado',              result: p.curQ ? `"${(p.curQ.text||'').substring(0,30)}…"` : 'null', ok: !!p.curQ },
    { icon:'👁', label:'showAnswer',               result: String(p.showAnswer), ok: p.showAnswer === true || !p.curQ },
    { icon:'✅', label:'resolved',                 result: String(p.resolved), ok: true },
    { icon:'⏱', label:'timer running',            result: String(p.running), ok: true },
    { icon:'👥', label:'equipos en partido',       result: (p.activeMatchTeams||[]).map(t=>t.name).join(', ') || 'ninguno', ok: true },
    { icon:'🎯', label:'responseMode',             result: p.responseMode, ok: true },
    { icon:'🏆', label:'winner enviado',           result: p.winner ? p.winner.name : 'null', ok: p.winner !== null || !gameState?.winner },
    { icon:'⏸', label:'showWait enviado',          result: String(p.showWait), ok: true },
    { icon:'⚡', label:'showTie enviado',           result: String(p.showTie), ok: true },
    { icon:'🌙', label:'projectorClear',           result: String(p.projectorClear), ok: true },
  ];

  const okCount = checks.filter(c => c.ok).length;
  document.getElementById('projector-status').textContent = `🖥️ Proyector: ${projectorConnected ? okCount+'/'+checks.length+' ✓' : 'desconectado'}`;
  document.getElementById('projector-status').style.color = projectorConnected ? 'var(--green)' : 'var(--muted)';

  el.innerHTML = checks.map(c => `
    <div class="proj-check">
      <span class="icon">${c.icon}</span>
      <span class="label">${c.label}</span>
      <span class="result ${c.ok ? 'ok' : 'bad'}">${escHtml(String(c.result))}</span>
    </div>
  `).join('');
}

// ─────────────────────────────────────────────────────────────────────────────
//  PAYLOAD DIFF
// ─────────────────────────────────────────────────────────────────────────────
function renderPayloadDiff() {
  const el = document.getElementById('payload-diff');
  if (!lastPayload) { el.textContent = '—'; return; }
  const p = lastPayload;
  const lines = [
    `curQ:          ${p.curQ ? `[E${p.curQ.stage}] ${(p.curQ.text||'').substring(0,40)}` : 'null'}`,
    `showAnswer:    ${p.showAnswer}`,
    `resolved:      ${p.resolved}`,
    `running:       ${p.running}`,
    `sel:           ${JSON.stringify(p.sel||{})}`,
    `winner:        ${p.winner ? p.winner.name : 'null'}`,
    `showWait:      ${p.showWait}`,
    `showTie:       ${p.showTie}`,
    `projectorClear:${p.projectorClear}`,
    `responseMode:  ${p.responseMode}`,
    `activeResponder:${p.activeResponderTeamIdx}`,
    `teams:         [${(p.teams||[]).map(t=>t.name).join(', ')}]`,
    `matchTeams:    [${(p.activeMatchTeams||[]).map(t=>t.name).join(', ')}]`,
  ];
  el.textContent = lines.join('\n');
}

// ─────────────────────────────────────────────────────────────────────────────
//  INDIVIDUAL TESTS
// ─────────────────────────────────────────────────────────────────────────────
const testResults = {};

async function runCheck(id) {
  let pass = false;
  let detail = '';

  switch(id) {
    case 'loop':
      // Mide mensajes durante 1 segundo
      const before = msgCount;
      await new Promise(r => setTimeout(r, 1000));
      const delta = msgCount - before;
      pass = delta < 15;
      detail = pass ? `${delta} mensajes/s — normal` : `⚠️ ${delta} mensajes/s — loop infinito en useEffect detectado`;
      break;

    case 'timer':
      pass = gameState !== null && gameState.running !== undefined;
      detail = gameState ? `running=${gameState.running}, remaining=${gameState.remaining}` : 'Sin datos del juego';
      break;

    case 'projector_conn':
      pass = projectorConnected;
      detail = pass ? `Conectado, último update: ${lastPayloadTime ? lastPayloadTime.toLocaleTimeString() : '—'}` : 'No se han recibido mensajes del proyector. Abre el proyector desde el juego.';
      break;

    case 'projector_sync':
      pass = lastPayload !== null;
      detail = pass ? `Payload con ${Object.keys(lastPayload).length} claves enviado a las ${lastPayloadTime.toLocaleTimeString()}` : 'Ningún payload recibido aún';
      break;

    case 'teams_valid':
      if (!gameState || !gameState.teams) { pass = false; detail = 'Sin datos de equipos'; break; }
      const t = gameState.teams;
      const hasDuplicates = t.length !== new Set(t.map(x=>x.name)).size;
      const hasInvalid = t.some(x => !x.name || x.score === undefined);
      pass = !hasDuplicates && !hasInvalid;
      detail = pass ? `${t.length} equipos, ${t.filter(x=>!x.eliminated).length} activos, sin duplicados` : `Problema: ${hasDuplicates?'nombres duplicados':''} ${hasInvalid?'campos inválidos':''}`;
      break;

    case 'curq_valid':
      if (!gameState || !gameState.curQ) { pass = true; detail = 'Sin pregunta activa (estado normal)'; break; }
      const q = gameState.curQ;
      const valid = q.id && q.text && q.stage && q.answer;
      pass = !!valid;
      detail = pass ? `E${q.stage} Nv${q.level}: "${q.text.substring(0,40)}"` : `Pregunta inválida: faltan campos`;
      break;

    case 'winner_logic':
      if (!gameState) { pass = false; detail = 'Sin datos'; break; }
      const active = (gameState.teams||[]).filter(t=>!t.eliminated);
      if (active.length === 1) {
        pass = gameState.winner !== null && gameState.winner !== undefined;
        detail = pass ? `Ganador detectado: ${gameState.winner.name}` : '⚠️ Solo 1 equipo activo pero winner es null — BUG';
      } else if (active.length === 0) {
        pass = false; detail = '⚠️ 0 equipos activos — estado inválido';
      } else {
        pass = gameState.winner === null || gameState.winner === undefined;
        detail = pass ? `${active.length} equipos activos, sin ganador aún (correcto)` : `⚠️ winner=${gameState.winner?.name} pero hay ${active.length} equipos activos`;
      }
      break;

    case 'idb':
      try {
        const req = indexedDB.open('DiloGameDB');
        pass = await new Promise((res) => {
          req.onsuccess = () => { req.result.close(); res(true); };
          req.onerror = () => res(false);
          setTimeout(() => res(false), 2000);
        });
        detail = pass ? 'DiloGameDB accesible' : 'No se pudo abrir DiloGameDB';
        if (pass) loadIDBInfo();
      } catch(e) { pass = false; detail = e.message; }
      break;

    case 'audio':
      try {
        const ac = new (window.AudioContext || window.webkitAudioContext)();
        pass = ac.state !== 'closed';
        detail = `AudioContext state: ${ac.state}`;
        if (ac.state === 'suspended') detail += ' (se activa con interacción del usuario)';
      } catch(e) { pass = false; detail = 'AudioContext no disponible: ' + e.message; }
      break;

    case 'broadcast':
      try {
        const ch = new BroadcastChannel('dilocontrol_test_' + Date.now());
        let received = false;
        ch.onmessage = () => { received = true; };
        ch.postMessage({ test: true });
        await new Promise(r => setTimeout(r, 100));
        pass = true; // BroadcastChannel API available
        detail = 'BroadcastChannel API disponible';
        ch.close();
      } catch(e) { pass = false; detail = e.message; }
      break;

    case 'voice':
      pass = 'SpeechRecognition' in window || 'webkitSpeechRecognition' in window;
      detail = pass ? 'SpeechRecognition API disponible' : 'No disponible en este navegador';
      break;
  }

  testResults[id] = { pass, detail };
  const dot = document.getElementById('dot-' + id);
  if (dot) { dot.className = 'result-dot ' + (pass ? 'pass' : 'fail'); }
  addLog(pass ? 'info' : 'warn', `Test [${id}]: ${pass ? '✓ PASS' : '✗ FAIL'} — ${detail}`);
}

async function runAllChecks() {
  const ids = ['loop','timer','projector_conn','projector_sync','teams_valid','curq_valid','winner_logic','idb','audio','broadcast','voice'];
  for (const id of ids) await runCheck(id);
  addLog('info', `--- Tests completados: ${Object.values(testResults).filter(r=>r.pass).length}/${ids.length} pasaron ---`);
}

// ─────────────────────────────────────────────────────────────────────────────
//  IDB INSPECTOR
// ─────────────────────────────────────────────────────────────────────────────
async function loadIDBInfo() {
  const el = document.getElementById('idb-info');
  try {
    const dbs = [
      { name: 'DiloGameDB', stores: ['gameState','questions','settings','questionHistory'] },
      { name: 'DiloSoundDB', stores: ['sounds'] },
    ];
    let html = '';
    for (const db of dbs) {
      const req = indexedDB.open(db.name);
      const result = await new Promise((res) => {
        req.onsuccess = async (e) => {
          const d = e.target.result;
          const info = [];
          for (const store of db.stores) {
            if (!d.objectStoreNames.contains(store)) { info.push({ store, count: '—' }); continue; }
            const count = await new Promise(r2 => {
              const tx = d.transaction(store, 'readonly');
              const s = tx.objectStore(store);
              const cr = s.count();
              cr.onsuccess = () => r2(cr.result);
              cr.onerror = () => r2('err');
            });
            info.push({ store, count });
          }
          d.close();
          res(info);
        };
        req.onerror = () => res(null);
        setTimeout(() => res(null), 2000);
      });
      if (!result) { html += `<div class="kv"><span class="k">${db.name}</span><span class="v err">no accesible</span></div>`; continue; }
      html += `<div style="margin-bottom:8px"><div style="font-size:9px;color:var(--blue);margin-bottom:4px;font-family:var(--mono)">${db.name}</div>`;
      html += `<table class="idb-table"><thead><tr><th>Store</th><th>Registros</th></tr></thead><tbody>`;
      html += result.map(r => `<tr><td>${r.store}</td><td style="color:${r.count > 0 ? 'var(--green)':'var(--muted)'}">${r.count}</td></tr>`).join('');
      html += `</tbody></table></div>`;
    }
    el.innerHTML = html;
  } catch(e) {
    el.innerHTML = `<div class="no-data" style="color:var(--red)">${e.message}</div>`;
  }
}

// ─────────────────────────────────────────────────────────────────────────────
//  EVENT LOG
// ─────────────────────────────────────────────────────────────────────────────
function addLog(type, msg) {
  const entry = { type, msg, time: new Date().toLocaleTimeString() };
  logEntries.unshift(entry);
  if (logEntries.length > 300) logEntries.pop();
  renderLog();
}

function renderLog() {
  const el = document.getElementById('log-body');
  const badge = document.getElementById('log-badge');
  const filters = {
    state: document.getElementById('filter-state')?.checked,
    cmd: document.getElementById('filter-cmd')?.checked,
    projector: document.getElementById('filter-projector')?.checked,
    error: document.getElementById('filter-error')?.checked,
  };
  const visible = logEntries.filter(e => {
    if (e.type === 'state' && !filters.state) return false;
    if (e.type === 'cmd' && !filters.cmd) return false;
    if ((e.type === 'projector') && !filters.projector) return false;
    if ((e.type === 'error' || e.type === 'warn') && !filters.error) return false;
    return true;
  });
  badge.textContent = logEntries.length;
  el.innerHTML = visible.slice(0, 100).map((e, i) => `
    <div class="log-line">
      <span class="log-time">${e.time}</span>
      <span class="log-type ${e.type}">${e.type}</span>
      <span class="log-msg">${escHtml(e.msg)}</span>
    </div>
  `).join('');
}

function clearLog() {
  logEntries = [];
  renderLog();
}

function exportLog() {
  const txt = logEntries.map(e => `[${e.time}] [${e.type.toUpperCase()}] ${e.msg}`).join('\n');
  const blob = new Blob([txt], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `debug_log_${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.txt`;
  a.click();
}

// ─────────────────────────────────────────────────────────────────────────────
//  UTILS
// ─────────────────────────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toggleRaw() {
  showRaw = !showRaw;
  document.getElementById('raw-btn').style.color = showRaw ? 'var(--yellow)' : 'var(--muted)';
  renderState();
}

// ─────────────────────────────────────────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────────────────────────────────────────
initBroadcast();
loadIDBInfo();
addLog('info', 'Debugger iniciado — abre el juego en otra pestaña/ventana');
addLog('info', 'Para conectar: abre el proyector desde el juego (los mensajes postMessage pasarán por aquí si están en la misma origin)');
addLog('info', 'URL del juego esperada: ' + window.location.origin + '/index.html');
